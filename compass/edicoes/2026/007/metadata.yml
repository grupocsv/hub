abstract: "Análise estrutural das principais fontes de desperdício na saúde suplementar brasileira em 2026, incluindo fragmentação do cuidado, sobreutilização clínica, fraudes administrativas, abusos em OPME e insegurança assistencial. Apresenta dados quantitativos atualizados, comparações internacionais e recomendações estratégicas para a transição de modelos de remuneração baseados em valor."
