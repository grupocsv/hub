name: Sync Hub content to R2 (AI Search)

on:
  workflow_run:
    workflows: ["Deploy VitePress site to Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: hub-ai-search-production
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event_name == 'workflow_run' &&
          (
            github.event.workflow_run.event == 'push' ||
            github.event.workflow_run.event == 'workflow_dispatch'
          ) &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Generate portal tools.json
        run: python3 scripts/generate-portal-tools.py .

      - name: Regenerate manifest.json
        run: python3 scripts/generate-manifest.py .

      - name: Install rclone
        run: |
          # Manifesto oficial: https://downloads.rclone.org/v1.74.4/SHA256SUMS
          RCLONE_VERSION="1.74.4"
          RCLONE_ARCHIVE="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          RCLONE_SHA256="fe435e0c36228e7c2f116a8701f01127bb1f694005fc11d1f27186c8bca4115d"
          RCLONE_DOWNLOAD="/tmp/${RCLONE_ARCHIVE}"
          RCLONE_UNPACKED="/tmp/rclone-${RCLONE_VERSION}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "${RCLONE_DOWNLOAD}" \
            "https://downloads.rclone.org/v${RCLONE_VERSION}/${RCLONE_ARCHIVE}"
          printf '%s  %s\n' "${RCLONE_SHA256}" "${RCLONE_DOWNLOAD}" \
            | sha256sum --check --strict -
          mkdir -p "${RCLONE_UNPACKED}"
          unzip -q "${RCLONE_DOWNLOAD}" -d "${RCLONE_UNPACKED}"
          sudo install -m 0755 \
            "${RCLONE_UNPACKED}/rclone-v${RCLONE_VERSION}-linux-amd64/rclone" \
            /usr/local/bin/rclone
          rclone version | grep -F "rclone v${RCLONE_VERSION}"

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF

      - name: Sync indexable content to R2
        run: |
          BUCKET="hub-csv-knowledge"

          # Sync markdown, HTML, JSON, CSV, TXT files (skip large binaries )
          rclone sync . "r2:${BUCKET}/" \
            --include "*.md" \
            --include "*.html" \
            --include "*.json" \
            --include "*.csv" \
            --include "*.txt" \
            --include "*.pdf" \
            --exclude ".git/**" \
            --exclude "node_modules/**" \
            --exclude "docs/.vitepress/cache/**" \
            --exclude "package-lock.json" \
            --max-size 4M \
            --transfers 10 \
            --checkers 20 \
            --verbose

      - name: Trigger and await AI Search sync job
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_SEARCH_TOKEN: ${{ secrets.CF_AI_SEARCH_TOKEN }}
        run: |
          set -euo pipefail
          BASE_URL="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai-search/instances/hub-csv"
          RESPONSE_FILE="$(mktemp)"
          COMPLETED=false
          trap 'rm -f "${RESPONSE_FILE}"' EXIT

          HTTP_CODE=$(curl --silent --show-error \
            --output "${RESPONSE_FILE}" \
            --write-out '%{http_code}' \
            --request POST \
            "${BASE_URL}/jobs" \
            --header "Authorization: Bearer ${CF_AI_SEARCH_TOKEN}" \
            --header 'Content-Type: application/json')
          if [[ ! "${HTTP_CODE}" =~ ^2[0-9][0-9]$ ]]; then
            echo "Falha ao criar job de sincronização do AI Search (HTTP ${HTTP_CODE})." >&2
            exit 1
          fi
          JOB_ID=$(jq --exit-status --raw-output '.result.id' "${RESPONSE_FILE}")
          if [[ -z "${JOB_ID}" || "${JOB_ID}" == "null" ]]; then
            echo 'A API não retornou o identificador do job do AI Search.' >&2
            exit 1
          fi
          echo "Job do AI Search criado; aguardando conclusão."

          for ATTEMPT in $(seq 1 90); do
            HTTP_CODE=$(curl --silent --show-error \
              --output "${RESPONSE_FILE}" \
              --write-out '%{http_code}' \
              "${BASE_URL}/jobs/${JOB_ID}" \
              --header "Authorization: Bearer ${CF_AI_SEARCH_TOKEN}")
            if [[ "${HTTP_CODE}" != "200" ]]; then
              echo "Falha ao consultar job do AI Search (HTTP ${HTTP_CODE})." >&2
              exit 1
            fi
            ENDED_AT=$(jq --raw-output '.result.ended_at // empty' "${RESPONSE_FILE}")
            END_REASON=$(jq --raw-output '.result.end_reason // empty' "${RESPONSE_FILE}")
            if [[ -n "${ENDED_AT}" ]]; then
              if [[ -n "${END_REASON}" ]]; then
                echo "Job do AI Search terminou com falha: ${END_REASON}." >&2
                exit 1
              fi
              COMPLETED=true
              echo "Job do AI Search concluído após ${ATTEMPT} consulta(s)."
              break
            fi
            sleep 10
          done

          if [[ "${COMPLETED}" != "true" ]]; then
            echo 'Timeout ao aguardar a conclusão do job do AI Search.' >&2
            exit 1
          fi

          STATS_READY=false
          for STATS_ATTEMPT in $(seq 1 90); do
            HTTP_CODE=$(curl --silent --show-error \
              --output "${RESPONSE_FILE}" \
              --write-out '%{http_code}' \
              "${BASE_URL}/stats" \
              --header "Authorization: Bearer ${CF_AI_SEARCH_TOKEN}")
            if [[ "${HTTP_CODE}" != "200" ]]; then
              echo "Falha ao consultar estatísticas do AI Search (HTTP ${HTTP_CODE})." >&2
              exit 1
            fi
            if ! jq --exit-status '
              .success == true and
              .result.error == 0 and
              .result.outdated == 0
            ' "${RESPONSE_FILE}" >/dev/null; then
              echo 'As estatísticas do AI Search registraram erro ou item desatualizado.' >&2
              exit 1
            fi
            if jq --exit-status '
              .result.queued == 0 and
              .result.running == 0
            ' "${RESPONSE_FILE}" >/dev/null; then
              STATS_READY=true
              echo "Estatísticas do AI Search estabilizadas após ${STATS_ATTEMPT} consulta(s)."
              break
            fi
            sleep 10
          done

          if [[ "${STATS_READY}" != "true" ]]; then
            echo 'Timeout ao aguardar a estabilização das estatísticas do AI Search.' >&2
            exit 1
          fi
          echo 'Sincronização e validação do AI Search concluídas.'
