name: Sync Hub content to R2 (AI Search)

on:
  workflow_run:
    workflows: ["Deploy VitePress site to Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: hub-ai-search-production
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event_name == 'workflow_run' &&
          (
            github.event.workflow_run.event == 'push' ||
            github.event.workflow_run.event == 'workflow_dispatch'
          ) &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Generate portal tools.json
        run: python3 scripts/generate-portal-tools.py .

      - name: Regenerate manifest.json
        run: python3 scripts/generate-manifest.py .

      - name: Install rclone
        run: |
          # Manifesto oficial: https://downloads.rclone.org/v1.74.4/SHA256SUMS
          RCLONE_VERSION="1.74.4"
          RCLONE_ARCHIVE="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          RCLONE_SHA256="fe435e0c36228e7c2f116a8701f01127bb1f694005fc11d1f27186c8bca4115d"
          RCLONE_DOWNLOAD="/tmp/${RCLONE_ARCHIVE}"
          RCLONE_UNPACKED="/tmp/rclone-${RCLONE_VERSION}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "${RCLONE_DOWNLOAD}" \
            "https://downloads.rclone.org/v${RCLONE_VERSION}/${RCLONE_ARCHIVE}"
          printf '%s  %s\n' "${RCLONE_SHA256}" "${RCLONE_DOWNLOAD}" \
            | sha256sum --check --strict -
          mkdir -p "${RCLONE_UNPACKED}"
          unzip -q "${RCLONE_DOWNLOAD}" -d "${RCLONE_UNPACKED}"
          sudo install -m 0755 \
            "${RCLONE_UNPACKED}/rclone-v${RCLONE_VERSION}-linux-amd64/rclone" \
            /usr/local/bin/rclone
          rclone version | grep -F "rclone v${RCLONE_VERSION}"

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF

      - name: Sync indexable content to R2
        run: |
          BUCKET="hub-csv-knowledge"

          # Sync markdown, HTML, JSON, CSV, TXT files (skip large binaries )
          rclone sync . "r2:${BUCKET}/" \
            --include "*.md" \
            --include "*.html" \
            --include "*.json" \
            --include "*.csv" \
            --include "*.txt" \
            --include "*.pdf" \
            --exclude ".git/**" \
            --exclude "node_modules/**" \
            --exclude "docs/.vitepress/cache/**" \
            --exclude "package-lock.json" \
            --max-size 4M \
            --transfers 10 \
            --checkers 20 \
            --verbose

      - name: Trigger AI Search re-index
        run: |
          # Novo endpoint AI Search (pos-migracao jun/2026)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/ai-search/instances/hub-csv" \
            -H "Authorization: Bearer ${{ secrets.CF_AI_SEARCH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"enable": true}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "AI Search sync triggered (HTTP $HTTP_CODE)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Aviso: Resposta inesperada. Tentando endpoint legado..."
            curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/autorag/hub-csv/reindex" \
              -H "Authorization: Bearer ${{ secrets.CF_AI_SEARCH_TOKEN }}" \
              -H "Content-Type: application/json" || true
          fi
          echo "Re-index concluido."
