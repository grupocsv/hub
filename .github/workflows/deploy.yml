name: Deploy VitePress site to Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('hub-documentos-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependency
        run: python3 -m pip install openpyxl==3.1.5

      - name: Check portal links
        run: python3 scripts/check-portal-links.py

      - name: Check canonical product inventory
        run: python3 scripts/check-product-inventory.py

      - name: Test Terapias Especiais data pipeline
        run: python3 scripts/build-tea-data.py --selftest

      - name: Check shareable page reproducibility
        run: |
          python3 scripts/build-tea-data.py --emit-p
          git diff --exit-code -- p/painel-tea/index.html

      - name: Validate Terapias Especiais artifacts
        run: python3 scripts/check-tea-artifacts.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            _infra/package-lock.json
            docs/_infra/package-lock.json

      - name: Setup Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Install auxiliary VitePress dependencies
        run: |
          npm --prefix _infra ci
          npm --prefix docs/_infra ci

      - name: Audit all VitePress dependency graphs
        run: |
          npm audit --audit-level=moderate
          npm --prefix _infra audit --audit-level=moderate
          npm --prefix docs/_infra audit --audit-level=moderate

      - name: Validate all VitePress dependency trees
        run: |
          npm ls vitepress vite esbuild --all
          npm --prefix _infra ls vitepress vite esbuild --all
          npm --prefix docs/_infra ls vitepress vite esbuild --all

      - name: Generate portal tools.json
        run: python3 scripts/generate-portal-tools.py .

      - name: Test Hub Documentos contracts
        run: npm run documentos:test

      - name: Generate Hub Documentos runtime config
        run: npm run documentos:generate

      - name: Reject generated artifact drift
        run: |
          git diff --exit-code -- \
            docs/public/documentos \
            unimed/tools.json \
            unihealth/tools.json \
            icds/tools.json
          drift="$(git status --porcelain -- \
            docs/public/documentos \
            unimed/tools.json \
            unihealth/tools.json \
            icds/tools.json)"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo "::error::artefatos gerados não versionados ou divergentes"
            exit 1
          fi

      - name: Build with VitePress
        run: npm run docs:build

      - name: Validate published PDF.js manifest
        run: node scripts/verify-documentos-pdfjs-manifest.mjs docs/.vitepress/dist

      - name: Install pinned Chromium for Hub Documentos E2E
        run: npm exec -- playwright install --with-deps chromium

      - name: Test built Hub Documentos in Chromium
        env:
          DOCUMENTOS_E2E_PUBLIC_ROOT: docs/.vitepress/dist
        run: npm run documentos:e2e

      - name: Regenerate manifest.json
        run: python3 scripts/generate-manifest.py .

      - name: Copy static content to dist
        run: |
          DIST=docs/.vitepress/dist

          # Save VitePress-built index pages (with nav + visual design)
          for dir in axia medvalor thera compliance founder unimed unihealth icds; do
            [ -f "$DIST/$dir/index.html" ] && cp "$DIST/$dir/index.html" "/tmp/vp_${dir}.html"
          done

          # Copy standalone HTML modules (sub-pages, dashboards, policies)
          cp -r axia "$DIST/" 2>/dev/null || true
          cp -r admin "$DIST/" 2>/dev/null || true
          cp -r scripts "$DIST/" 2>/dev/null || true
          cp -r medvalor "$DIST/" 2>/dev/null || true
          cp -r thera "$DIST/" 2>/dev/null || true
          cp -r unimed "$DIST/" 2>/dev/null || true
          cp -r unihealth "$DIST/" 2>/dev/null || true
          cp -r compliance "$DIST/" 2>/dev/null || true
          cp -r founder "$DIST/" 2>/dev/null || true
          cp -r icds "$DIST/" 2>/dev/null || true
          # deck/ desativado — redirecionado para deck.grupocsv.com (Cloudflare Pages)
          mkdir -p "$DIST/deck"
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta http-equiv="refresh" content="0;url=https://deck.grupocsv.com"><title>Redirecionando...</title></head><body><p>Redirecionando para <a href="https://deck.grupocsv.com">deck.grupocsv.com</a></p></body></html>' > "$DIST/deck/index.html"
          cp -r panta "$DIST/" 2>/dev/null || true
          cp -r p "$DIST/" 2>/dev/null || true

          # Restore VitePress-built index pages (preserve SPA navigation)
          for dir in axia medvalor thera compliance founder unimed unihealth icds; do
            [ -f "/tmp/vp_${dir}.html" ] && cp "/tmp/vp_${dir}.html" "$DIST/$dir/index.html"
          done

          # Note: _infra is NOT copied here because VitePress builds it from docs/_infra/

          # Copy assets
          cp -r assets "$DIST/" 2>/dev/null || true

          # Copy root files
          cp CNAME "$DIST/" 2>/dev/null || true
          cp site.webmanifest "$DIST/" 2>/dev/null || true
          cp llms.txt "$DIST/" 2>/dev/null || true
          cp manifest.json "$DIST/" 2>/dev/null || true
          cp completeness-checklist.md "$DIST/" 2>/dev/null || true

      - name: Smoke test do build (artefato íntegro)
        run: |
          DIST=docs/.vitepress/dist
          fail=0
          # Arquivos críticos que precisam existir no artefato publicado.
          # Os cp acima são resilientes (|| true) de propósito; este passo é a
          # rede de segurança que reprova o deploy se algo sumir em silêncio.
          for f in \
            index.html \
            robots.txt \
            CNAME \
            manifest.json \
            scripts/hub-auth.js \
            scripts/hub-auth.css \
            documentos/index.html \
            documentos/assets/api-client.js \
            documentos/assets/app.js \
            documentos/assets/catalog.js \
            documentos/assets/detail.js \
            documentos/assets/documentos.css \
            documentos/assets/runtime-config.js \
            documentos/assets/session.js \
            documentos/assets/upload.js \
            documentos/assets/view.js \
            documentos/assets/viewer.js \
            documentos/assets/workspace.js \
            documentos/vendor/pdfjs/LICENSE \
            documentos/vendor/pdfjs/manifest.json \
            documentos/vendor/pdfjs/build/pdf.min.mjs \
            documentos/vendor/pdfjs/build/pdf.worker.min.mjs \
            unimed/index.html unimed/tea.html \
            p/painel-tea/index.html \
            unihealth/index.html \
            icds/index.html \
            axia/nota-fiscal.html axia/sistema-unimed.html \
            compliance/privacidade.html; do
            if [ ! -f "$DIST/$f" ]; then
              echo "::error::arquivo critico ausente no build: $f"
              fail=1
            fi
          done
          # O meta noindex deve sobreviver nas sub-páginas restritas standalone.
          if [ -f "$DIST/unimed/tea.html" ] && ! grep -q '<meta name="robots" content="noindex, nofollow">' "$DIST/unimed/tea.html"; then
            echo "::error::meta noindex, nofollow ausente em unimed/tea.html apos o build"
            fail=1
          fi
          if [ -f "$DIST/p/painel-tea/index.html" ] && ! grep -q '<meta name="robots" content="noindex, nofollow">' "$DIST/p/painel-tea/index.html"; then
            echo "::error::meta noindex, nofollow ausente em p/painel-tea/index.html apos o build"
            fail=1
          fi
          if [ -f "$DIST/axia/sistema-unimed.html" ] && ! grep -q '<meta name="robots" content="noindex, nofollow">' "$DIST/axia/sistema-unimed.html"; then
            echo "::error::meta noindex, nofollow ausente em axia/sistema-unimed.html apos o build"
            fail=1
          fi
          if [ -f "$DIST/axia/sistema-unimed.html" ] && ! grep -q '<meta name="hub-category" content="webapp">' "$DIST/axia/sistema-unimed.html"; then
            echo "::error::hub-category=webapp ausente em axia/sistema-unimed.html apos o build"
            fail=1
          fi
          if [ -f "$DIST/axia/sistema-unimed.html" ] && ! grep -q '<meta name="hub-entity" content="AxiaCare">' "$DIST/axia/sistema-unimed.html"; then
            echo "::error::hub-entity=AxiaCare ausente em axia/sistema-unimed.html apos o build"
            fail=1
          fi
          if [ -f "$DIST/axia/sistema-unimed.html" ] && ! grep -q '<script src="/scripts/hub-auth.js" data-portal="axia"></script>' "$DIST/axia/sistema-unimed.html"; then
            echo "::error::gate AxiaCare ausente em axia/sistema-unimed.html apos o build"
            fail=1
          fi
          if [ -f "$DIST/documentos/index.html" ]; then
            if ! grep -q '<meta name="robots" content="noindex, nofollow">' "$DIST/documentos/index.html"; then
              echo "::error::meta noindex, nofollow ausente em documentos/index.html apos o build"
              fail=1
            fi
            if ! grep -q 'http-equiv="Content-Security-Policy"' "$DIST/documentos/index.html"; then
              echo "::error::CSP ausente em documentos/index.html apos o build"
              fail=1
            fi
            if grep -Eq "script-src[^;\"]*'unsafe-inline'|style-src[^;\"]*'unsafe-inline'" "$DIST/documentos/index.html"; then
              echo "::error::CSP permissiva em documentos/index.html apos o build"
              fail=1
            fi
            if ! grep -q "windowRef.top === windowRef.self" "$DIST/documentos/assets/app.js"; then
              echo "::error::bloqueio de contexto enquadrado ausente em documentos/assets/app.js"
              fail=1
            fi
          fi
          if [ "$fail" = "0" ]; then
            echo "Smoke test OK: artefato integro."
          else
            echo "Smoke test FALHOU: artefato incompleto — deploy abortado."
            exit 1
          fi

      - name: Validate published Terapias Especiais artifact
        run: python3 scripts/check-tea-artifacts.py --root docs/.vitepress/dist

      - name: Upload artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
