<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="hub-category" content="dashboard">
  <meta name="hub-entity" content="Unimed GV">
  <meta name="description" content="GCE, Gerenciamento de Casos Especiais da Unimed Governador Valadares. Agora no aplicativo do GCE, em gce.unimedgv.com.">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="0; url=https://gce.unimedgv.com">
  <title>Aplicativo do GCE | Unimed Governador Valadares</title>
  <link rel="icon" href="/favicons/favicon.ico">
  <style>
    :root {
      --u-green: #00995d;
      --u-dark: #004e4c;
      --u-paper: #fafaf7;
      --u-stone: #6b6f6c;
      --u-line: #e3e3dc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      background: var(--u-paper);
      color: var(--u-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #ffffff;
      border: 1px solid var(--u-line);
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(0,78,76,0.04), 0 6px 24px rgba(0,78,76,0.06);
      padding: 40px 36px;
      max-width: 420px;
      text-align: center;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--u-stone); line-height: 1.55; margin-bottom: 20px; }
    a.botao {
      display: inline-block;
      background: var(--u-green);
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 22px;
      border-radius: 10px;
    }
    a.botao:hover { background: #007a4b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>O painel do GCE mudou de endereço</h1>
    <p>O Gerenciamento de Casos Especiais agora tem um aplicativo próprio, com acesso individual. Você será redirecionado automaticamente.</p>
    <a class="botao" href="https://gce.unimedgv.com">Ir para gce.unimedgv.com</a>
  </div>
  <script>window.location.replace('https://gce.unimedgv.com');</script>
</body>
</html>
