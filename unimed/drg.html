  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    /* ═══ DESIGN SYSTEM — Tokens Unimed ═══ */
    :root {
      --u-green: #00995d;
      --u-green-700: #007a4b;
      --u-green-300: #7fcaa5;
      --u-green-200: #cfe5bc;
      --u-green-100: #eaf3df;
      --u-citrus: #8baf1f;
      --u-dark: #004e4c;
      --u-orange: #f47920;
      --u-paper: #fafaf7;
      --u-white: #ffffff;
      --u-cloud: #f1f1ec;
      --u-line: #e3e3dc;
      --u-ash: #c9c9c0;
      --u-stone: #6b6f6c;
      --u-coal: #2a2f2d;
      --font-display: "Inter", "Helvetica Neue", Arial, sans-serif;
      --font-body: "Source Serif 4", Georgia, serif;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-pill: 9999px;
      --shadow-soft: 0 1px 2px rgba(0,78,76,0.04), 0 6px 24px rgba(0,78,76,0.06);
      --ease-out: cubic-bezier(.2,.8,.2,1);
      --dur-base: 220ms;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }
    body {
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.55;
      color: var(--u-dark);
      background: var(--u-paper);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    #drg-root { min-height: 100vh; display: flex; flex-direction: column; }
    @media print { body { background: #fff; } .drg-header, .drg-tabs, .drg-footer { display: none !important; } }

    /* ═══ HEADER ═══ */
    .drg-header {
      background: var(--u-dark);
      padding: 0 28px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drg-header__brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .drg-header__logo { height: 32px; width: auto; display: block; opacity: 0.95; }
    .drg-header__sep { width: 1px; height: 28px; background: rgba(255,255,255,0.12); }
    .drg-header__title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .drg-header__sub {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--u-green-300);
      opacity: 0.7;
    }

    /* ═══ TABS ═══ */
    .drg-tabs {
      background: var(--u-white);
      border-bottom: 1px solid var(--u-line);
      padding: 0 28px;
      display: flex;
      gap: 0;
      overflow-x: auto;
    }
    .drg-tabs__btn {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.02em;
      padding: 14px 20px;
      border: none;
      background: transparent;
      color: var(--u-stone);
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: all var(--dur-base) var(--ease-out);
    }
    .drg-tabs__btn:hover { color: var(--u-dark); }
    .drg-tabs__btn--active {
      color: var(--u-green);
      border-bottom-color: var(--u-green);
    }

    /* ═══ PERIOD BANNER ═══ */
    .drg-banner {
      background: var(--u-white);
      border-bottom: 1px solid var(--u-line);
      padding: 10px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .drg-banner__label {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--u-stone);
    }
    .drg-banner__period {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
      color: var(--u-dark);
      letter-spacing: -0.01em;
    }
    .drg-banner__badge {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 10px;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: var(--u-green-100);
      color: var(--u-green);
    }
    .drg-banner__kpis {
      margin-left: auto;
      display: flex;
      gap: 18px;
      font-family: var(--font-display);
      font-size: 12px;
      color: var(--u-stone);
    }
    .drg-banner__kpis strong { font-weight: 700; }

    /* ═══ CONTENT AREA ═══ */
    .drg-content {
      max-width: 1020px;
      margin: 0 auto;
      padding: 28px 24px;
      flex: 1;
    }

    /* ═══ SECTION TITLE ═══ */
    .sec-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--u-green);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--u-line);
    }

    /* ═══ CARDS ═══ */
    .card {
      background: var(--u-white);
      border: 1px solid var(--u-line);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 20px;
    }
    .card--compact { padding: 16px 20px; border-radius: var(--radius-md); }
    .card--brand {
      background: var(--u-green);
      color: #fff;
      border-color: transparent;
    }
    .card--brand .kpi {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.3);
    }
    .card--brand .kpi__value {
      color: #fff !important;
    }
    .card--brand .kpi__label {
      color: rgba(255,255,255,0.85);
    }
    .card--brand .sec-title {
      color: rgba(255,255,255,0.7);
      border-bottom-color: rgba(255,255,255,0.2);
    }

    /* ═══ KPI PILLS ═══ */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .kpi {
      background: var(--u-white);
      border: 1px solid var(--u-line);
      border-radius: var(--radius-md);
      padding: 18px 16px;
      text-align: center;
      overflow: hidden;
      min-width: 0;
    }
    .kpi__value {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(15px, 2.2vw, 22px);
      line-height: 1.2;
      color: var(--u-dark);
      font-feature-settings: "tnum" 1;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .kpi__label {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      color: var(--u-stone);
      margin-top: 6px;
      letter-spacing: 0.04em;
    }
    .kpi__sub {
      font-size: 11px;
      color: var(--u-ash);
      margin-top: 4px;
      font-weight: 500;
    }

    /* ═══ CHIPS (period shortcuts) ═══ */
    .chip-group {
      margin-bottom: 14px;
    }
    .chip-group__label {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--u-stone);
      margin-bottom: 6px;
    }
    .chip-group__row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      background: var(--u-white);
      color: var(--u-dark);
      border: 1px solid var(--u-line);
      cursor: pointer;
      transition: all 160ms var(--ease-out);
    }
    .chip:hover { border-color: var(--u-green-300); background: var(--u-green-100); }
    .chip--active {
      background: var(--u-dark);
      color: #fff;
      border-color: var(--u-dark);
    }

    /* ═══ BUTTONS ═══ */
    .btn {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 180ms var(--ease-out);
      line-height: 1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn--primary { background: var(--u-green); color: #fff; }
    .btn--primary:hover { background: var(--u-green-700); }
    .btn--secondary { background: transparent; color: var(--u-dark); border-color: var(--u-line); }
    .btn--secondary:hover { background: var(--u-cloud); }
    .btn--ghost { background: transparent; color: var(--u-green); padding: 10px 8px; }
    .btn--ghost:hover { color: var(--u-green-700); }
    .btn--danger { background: transparent; color: #c44d2d; border-color: rgba(196,77,45,0.3); }
    .btn--danger:hover { background: rgba(196,77,45,0.06); }
    .btn--sm { font-size: 11px; padding: 7px 14px; }

    /* ═══ FORM FIELDS ═══ */
    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .field__label {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      color: var(--u-dark);
      letter-spacing: 0.04em;
    }
    .field__input, .field__select {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 500;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--u-line);
      background: var(--u-white);
      color: var(--u-dark);
      outline: none;
      transition: border-color 180ms;
      font-feature-settings: "tnum" 1;
    }
    .field__input:focus, .field__select:focus {
      border-color: var(--u-green);
      box-shadow: 0 0 0 3px rgba(0,153,93,0.12);
    }
    .field__input--mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 13px; }
    .field__hint {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--u-stone);
    }

    /* ═══ TABLE ═══ */
    .drg-table-wrap {
      background: var(--u-white);
      border: 1px solid var(--u-line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .drg-table-scroll { overflow-x: auto; }
    .drg-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-display);
      font-size: 12px;
    }
    .drg-table thead tr {
      background: var(--u-dark);
    }
    .drg-table th {
      padding: 10px 12px;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      text-align: right;
      white-space: nowrap;
    }
    .drg-table th:first-child { text-align: left; }
    .drg-table td {
      padding: 6px 12px;
      border-bottom: 1px solid var(--u-line);
      text-align: right;
      color: var(--u-dark);
    }
    .drg-table td:first-child { text-align: left; font-weight: 600; }
    .drg-table tbody tr:hover { background: var(--u-green-100); }
    .drg-table .cell-input {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      text-align: right;
      background: transparent;
      color: var(--u-dark);
      outline: none;
      transition: border-color 120ms;
    }
    .drg-table .cell-input:focus {
      border-color: var(--u-green);
      background: var(--u-white);
    }

    /* ═══ COMP CARD (C1, C2, C3, CGP) ═══ */
    .comp-card {
      border: 1px solid var(--u-line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .comp-card__header {
      padding: 12px 18px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .comp-card__tag {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.7;
      color: #fff;
    }
    .comp-card__title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }
    .comp-card__body {
      padding: 16px 18px;
      background: var(--u-white);
    }

    /* ═══ TIMELINE DOTS ═══ */
    .timeline {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }
    .timeline__dot {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 7px;
      font-weight: 700;
      color: #fff;
      cursor: default;
    }

    /* ═══ CHART CONTAINER ═══ */
    .chart-wrap {
      background: var(--u-white);
      border: 1px solid var(--u-line);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
    }

    /* ═══ TWO COL GRID ═══ */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* ═══ FOOTER ═══ */
    .drg-footer {
      background: var(--u-dark);
      border-top: 1px solid rgba(255,255,255,0.08);
      margin-top: auto;
    }
    .drg-footer__top {
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .drg-footer__brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .drg-footer__logo { height: 28px; width: auto; opacity: 0.85; }
    .drg-footer__slogan {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--u-green-300);
      opacity: 0.6;
    }
    .drg-footer__doc {
      font-family: var(--font-display);
      font-size: 9px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.04em;
    }
    .drg-footer__resp {
      font-family: var(--font-display);
      font-size: 9px;
      color: rgba(255,255,255,0.45);
    }
    .drg-footer__bottom {
      padding: 10px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .drg-footer__links {
      display: flex;
      gap: 14px;
    }
    .drg-footer__links a {
      font-family: var(--font-display);
      font-size: 10px;
      color: var(--u-green-300);
      opacity: 0.6;
      text-decoration: none;
      transition: opacity 160ms;
    }
    .drg-footer__links a:hover { opacity: 1; }
    .drg-footer__copy {
      font-family: var(--font-display);
      font-size: 9px;
      color: rgba(255,255,255,0.35);
    }

    /* ═══ BADGES ═══ */
    .badge {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge--warning { background: #fef3cd; color: #856404; }
    .badge--success { background: var(--u-green-100); color: var(--u-green); }
    .badge--danger { background: rgba(196,77,45,0.08); color: #c44d2d; }
    .badge--info { background: rgba(0,78,76,0.06); color: var(--u-dark); }

    /* ═══ RESPONSIVE — TABLET (768px) ═══ */
    @media (max-width: 768px) {
      .drg-header { padding: 0 16px; height: 48px; }
      .drg-header__logo { height: 28px; }
      .drg-header__title { font-size: 14px; }
      .drg-tabs { padding: 0 12px; }
      .drg-tabs__btn { padding: 12px 14px; font-size: 11px; }
      .drg-banner { padding: 8px 16px; }
      .drg-banner__period { font-size: 13px; }
      .drg-content { padding: 20px 16px; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .kpi__value { font-size: clamp(14px, 2vw, 17px); }
      .kpi__sub { font-size: 10px; }
      .two-col { grid-template-columns: 1fr; }
      .drg-banner__kpis { display: none; }
      .card { padding: 18px 18px; border-radius: var(--radius-md); }
      .comp-card__header { padding: 10px 14px; }
      .comp-card__body { padding: 14px; }
      .chart-wrap { padding: 14px; }
      .drg-footer__top { padding: 12px 16px; }
      .drg-footer__bottom { padding: 8px 16px; }
    }

    /* ═══ RESPONSIVE — MOBILE (480px) ═══ */
    @media (max-width: 480px) {
      .drg-header { padding: 0 12px; height: 44px; gap: 10px; }
      .drg-header__logo { height: 24px; }
      .drg-header__sep { display: none; }
      .drg-header__title { font-size: 13px; }
      .drg-header__sub { display: none; }

      /* Tabs: horizontal scroll with snap, touch-friendly */
      .drg-tabs {
        padding: 0 8px;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .drg-tabs::-webkit-scrollbar { display: none; }
      .drg-tabs__btn {
        padding: 12px 12px;
        font-size: 11px;
        min-height: 44px;
        scroll-snap-align: start;
      }

      /* Banner: stack vertically */
      .drg-banner {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 8px 12px;
      }
      .drg-banner__period { font-size: 12px; }
      .drg-banner__badge { font-size: 9px; }

      /* Content: tighter padding */
      .drg-content { padding: 16px 10px; }

      /* KPIs: single column on very small screens */
      .kpi-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .kpi { padding: 12px 10px; }
      .kpi__value { font-size: 16px; }
      .kpi__label { font-size: 9px; }

      /* Cards: tighter */
      .card { padding: 14px 12px; border-radius: var(--radius-sm); margin-bottom: 14px; }
      .card--compact { padding: 12px 10px; }

      /* Chips: horizontal scroll with touch */
      .chip-group__row {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x mandatory;
        padding-bottom: 4px;
        scrollbar-width: none;
      }
      .chip-group__row::-webkit-scrollbar { display: none; }
      .chip {
        scroll-snap-align: start;
        flex-shrink: 0;
        min-height: 36px;
        display: flex;
        align-items: center;
      }

      /* Buttons: full width stacked */
      .btn-group {
        flex-direction: column;
        gap: 8px;
      }
      .btn-group .btn {
        width: 100%;
        justify-content: center;
        min-height: 44px;
      }

      /* Form fields: prevent iOS zoom */
      .field__input, .field__select {
        font-size: 16px;
        padding: 12px 14px;
      }

      /* TABLE: Transform to stacked card layout on mobile */
      .drg-table-wrap {
        border-radius: var(--radius-sm);
        border: none;
        background: transparent;
        overflow: visible;
      }
      .drg-table-scroll { overflow: visible; }
      .drg-table-wrap::after { display: none; }

      .drg-table {
        min-width: 0;
        display: block;
      }
      .drg-table thead { display: none; }
      .drg-table tbody {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .drg-table tbody tr {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 12px;
        background: var(--u-white);
        border: 1px solid var(--u-line);

    }
  return bank;
}

function keyToLabel(key) { const [y,m] = key.split("-"); return `${MESES_SHORT[parseInt(m)-1]}/${y}`; }
function periodKeys(startKey, endKey) {
  const [sy,sm] = startKey.split("-").map(Number);
  const [ey,em] = endKey.split("-").map(Number);
  const keys = []; let y = sy, m = sm;
  while (y < ey || (y === ey && m <= em)) { keys.push(`${y}-${String(m).padStart(2,"0")}`); m++; if (m > 12) { m = 1; y++; } }
  return keys;
}

// ─── CGP ────────────────────────────────────────────────────────
function calcCGP(params, totalLocal, totalIC) {
  const { enfLocal,enfIC,aptLocal,aptIC,utiLocal,utiIC, leitosInstalados,leitosHD,leitosUTI,mixApt } = params;
  const tot = totalLocal + totalIC;
  if (tot === 0) return null;
  const pl = totalLocal / tot, pi = 1 - pl;
  const op = leitosInstalados - leitosHD;
  if (op === 0) return null;
  const wUTI = leitosUTI / op, wConv = 1 - wUTI;
  const wApt = mixApt / 100, wEnf = 1 - wApt;
  const utiP = utiLocal*pl + utiIC*pi;
  const aptP = aptLocal*pl + aptIC*pi;
  const enfP = enfLocal*pl + enfIC*pi;
  const convP = wApt*aptP + wEnf*enfP;
  const cgp = wUTI*utiP + wConv*convP;
  return { cgp, utiP, aptP, enfP, convP, pl, pi, wUTI, wConv, op };
}

// ─── APP ─────────────────────────────────────────────────────
function DRGPlugin() {
  const saved = useMemo(() => lsLoad(), []);
  const [tab, setTab] = useState(0);
  const [params, setParams] = useState(saved?.params || { ...PARAMS_DEFAULT });
  const [bank, setBank] = useState(saved?.bank || { ...MONTH_BANK_INIT });
  const [startKey, setStartKey] = useState(saved?.startKey || "2024-01");
  const [endKey, setEndKey] = useState(saved?.endKey || "2026-04");
  const [copied, setCopied] = useState(null);
  const [supaStatus, setSupaStatus] = useState("idle");
  const [dataSource, setDataSource] = useState("local");
  const [pdfLoading, setPdfLoading] = useState(false);
  const [cloudStatus, setCloudStatus] = useState("idle"); // idle | saving | saved | error | loading
  const [cloudLastSaved, setCloudLastSaved] = useState(null);
  const [editingMonth, setEditingMonth] = useState(null);
  const saveTimerRef = useRef(null);

  // Get user email from hub-auth.js localStorage
  const hubUserEmail = useMemo(() => {
    try { return localStorage.getItem('hub_auth_unimed_email') || 'unknown'; } catch(e) { return 'unknown'; }
  }, []);

  useEffect(() => { lsSave({ params, bank, startKey, endKey }); }, [params, bank, startKey, endKey]);

  // ── Cloud Sync: Load from Worker on mount ──
  useEffect(() => {
    const loadFromCloud = async () => {
      try {
        setCloudStatus("loading");
        const res = await fetch(`${DATA_PROXY_URL}/load?config_id=1`, { headers: { 'Origin': window.location.origin } });
        if (!res.ok) throw new Error('Load failed');
        const data = await res.json();
        if (data && data.length > 0) {
          const newBank = { ...MONTH_BANK_INIT };
          for (const row of data) {
            newBank[row.month_key] = {
              altas: row.altas || 0,
              realizado: parseFloat(row.realizado) || 0,
              previsto: parseFloat(row.previsto) || 0,
              bonus: parseFloat(row.bonus) || 0,
              localAbs: row.local_abs || 0,
              icAbs: row.ic_abs || 0,
              hasData: row.has_data || false
            };
          }
          setBank(newBank);
          setDataSource("supabase");
        }
        setCloudStatus("saved");
        setTimeout(() => setCloudStatus("idle"), 2000);
      } catch(e) {
        console.warn("Cloud load failed, using local data:", e);
        setCloudStatus("idle");
      }
    };
    loadFromCloud();
  }, []);

  // ── Cloud Sync: Debounced save (2s after last edit) ──
  const saveMonthToCloud = useCallback(async (monthKey, monthData, oldValues) => {
    try {
      setCloudStatus("saving");
      const res = await fetch(`${DATA_PROXY_URL}/save`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-User-Email': hubUserEmail },
        body: JSON.stringify({
          month_key: monthKey,
          altas: monthData.altas || 0,
          realizado: monthData.realizado || 0,
          previsto: monthData.previsto || 0,
          bonus: monthData.bonus || 0,
          config_id: 1,
          _old_values: oldValues
        })
      });
      if (!res.ok) throw new Error('Save failed');
      const now = new Date();
      setCloudLastSaved(now.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}));
      setCloudStatus("saved");
      setTimeout(() => setCloudStatus("idle"), 3000);
    } catch(e) {
      console.error("Cloud save failed:", e);
      setCloudStatus("error");
      setTimeout(() => setCloudStatus("idle"), 5000);
    }
  }, [hubUserEmail]);

  // Enhanced setMonthField with debounced cloud save
  const setMonthFieldWithSync = useCallback((key, field, val) => {
    const oldValues = bank[key] ? { ...bank[key] } : {};
    setBank(prev => {
      const updated = { ...prev, [key]: { ...prev[key], [field]: parseFloat(val) || 0, hasData: true } };
      // Debounced cloud save
      if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
      saveTimerRef.current = setTimeout(() => {
        saveMonthToCloud(key, updated[key], oldValues);
      }, 2000);
      return updated;
    });
  }, [bank, saveMonthToCloud]);

  const resetToDefaults = () => {
    setParams({ ...PARAMS_DEFAULT }); setBank({ ...MONTH_BANK_INIT });
    setStartKey("2024-01"); setEndKey("2026-04"); lsClear(); setDataSource("local");
  };
  const setParam = k => v => setParams(prev => ({ ...prev, [k]: v }));
  const setMonthField = useCallback((key, field, val) => {
    setBank(prev => ({ ...prev, [key]: { ...prev[key], [field]: parseFloat(val) || 0, hasData: true } }));
  }, []);

  const keys = useMemo(() => periodKeys(startKey, endKey), [startKey, endKey]);

  const agg = useMemo(() => {
    let totalAltas=0, totalReal=0, totalPrev=0, totalBonus=0, totalLocal=0, totalIC=0, diarExc=0, diarEvit=0;
    const monthRows = [];
    for (const k of keys) {
      const d = bank[k] || { altas:0, realizado:0, previsto:0, bonus:0, localAbs:0, icAbs:0 };
      totalAltas += d.altas; totalReal += d.realizado; totalPrev += d.previsto;
      totalBonus += d.bonus; totalLocal += d.localAbs; totalIC += d.icAbs;
      const exc = Math.max(0, d.realizado - d.previsto);
      const evit = Math.max(0, d.previsto - d.realizado);
      diarExc += exc; diarEvit += evit;
      monthRows.push({ key:k, ...d, exc, evit });
    }
    return { totalAltas, totalReal, totalPrev, totalBonus, totalLocal, totalIC, diarExc, diarEvit, monthRows };
  }, [keys, bank]);

  const cgpData = useMemo(() => calcCGP(params, agg.totalLocal, agg.totalIC), [params, agg.totalLocal, agg.totalIC]);
  const inef = agg.totalPrev > 0 ? (agg.totalReal / agg.totalPrev) * 100 : null;
  const C1 = cgpData && agg.diarExc > 0 ? agg.diarExc * cgpData.cgp : null;
  const C2 = cgpData && agg.diarEvit > 0 ? agg.diarEvit * cgpData.cgp : null;
  const C3 = agg.totalBonus > 0 ? agg.totalBonus : null;
  const TOTAL = (C1||0) + (C2||0) + (C3||0);
  const nMonths = keys.length;

  const allYears = [2023,2024,2025,2026,2027];
  const yearMonthOptions = [];
  for (const y of allYears) for (let m=1;m<=12;m++) yearMonthOptions.push(`${y}-${String(m).padStart(2,"0")}`);

  const copy = (text, key) => { navigator.clipboard.writeText(text); setCopied(key); setTimeout(() => setCopied(null), 2000); };

  const statusColor = inef === null ? C.muted : inef > 105 ? C.red : inef > 100 ? C.orange : inef > 95 ? C.green : C.deep;
  const statusLabel = inef === null ? "Sem dados" : inef > 105 ? "Ineficiente" : inef > 100 ? "Acima do baseline" : inef > 95 ? "Eficiente" : "Alta eficiência";

  // ── M5: Comparativo YoY ──
  const [yoyCycle1, setYoyCycle1] = useState("2024");
  const [yoyCycle2, setYoyCycle2] = useState("2025");
  const calcCycleMetrics = (year) => {
    const ks = periodKeys(`${year}-01`, `${year}-12`);
    let tAltas=0,tReal=0,tPrev=0,tBonus=0,tLocal=0,tIC=0,dExc=0,dEvit=0;
    for (const k of ks) {
      const d = bank[k] || {};
      tAltas += d.altas||0; tReal += d.realizado||0; tPrev += d.previsto||0;
      tBonus += d.bonus||0; tLocal += d.localAbs||0; tIC += d.icAbs||0;
      dExc += Math.max(0,(d.realizado||0)-(d.previsto||0));
      dEvit += Math.max(0,(d.previsto||0)-(d.realizado||0));
    }
    const cgp = calcCGP(params, tLocal, tIC);
    const c1 = cgp && dExc > 0 ? dExc * cgp.cgp : 0;
    const c2 = cgp && dEvit > 0 ? dEvit * cgp.cgp : 0;
    const c3 = tBonus;
    const total = c1 + c2 + c3;
    const inefPct = tPrev > 0 ? (tReal/tPrev)*100 : null;
    return { altas:tAltas, realizado:tReal, previsto:tPrev, inef:inefPct, c1, c2, c3, total, cgp: cgp?.cgp||0 };
  };

  // ── M6: Simulador What-If ──
  const [simParams, setSimParams] = useState({ ...PARAMS_DEFAULT });
  const [simMeta, setSimMeta] = useState(95);
  const simCgpData = useMemo(() => calcCGP(simParams, agg.totalLocal, agg.totalIC), [simParams, agg.totalLocal, agg.totalIC]);

                <Pill label="Enf Ponderada" value={fmtV(cgpData.enfP)} color={C.deep}/>
                <Pill label="Conv Ponderada" value={fmtV(cgpData.convP)} color={C.deep}/>
                <Pill label="% Local" value={pct(cgpData.pl*100)} color={C.green}/>
                <Pill label="% Intercâmbio" value={pct(cgpData.pi*100)} color={C.orange}/>
                <Pill label="Leitos Operacionais" value={String(cgpData.op)} color={C.ink}/>
              </div>
            </div>
            <div className="card">
              <SecTitle>Fórmula Detalhada</SecTitle>
              <div style={{fontFamily:"monospace",fontSize:12,lineHeight:1.8,color:C.ink}}>
                <div>UTI_pond = {fmtV(params.utiLocal)} × {(cgpData.pl).toFixed(4)} + {fmtV(params.utiIC)} × {(cgpData.pi).toFixed(4)} = <strong>{fmtV(cgpData.utiP)}</strong></div>
                <div>Apt_pond = {fmtV(params.aptLocal)} × {(cgpData.pl).toFixed(4)} + {fmtV(params.aptIC)} × {(cgpData.pi).toFixed(4)} = <strong>{fmtV(cgpData.aptP)}</strong></div>
                <div>Enf_pond = {fmtV(params.enfLocal)} × {(cgpData.pl).toFixed(4)} + {fmtV(params.enfIC)} × {(cgpData.pi).toFixed(4)} = <strong>{fmtV(cgpData.enfP)}</strong></div>
                <div>Conv_pond = 0,{params.mixApt}×Apt + 0,{100-params.mixApt}×Enf = <strong>{fmtV(cgpData.convP)}</strong></div>
                <div style={{marginTop:8,fontWeight:700}}>CGP = {(cgpData.wUTI).toFixed(5)}×UTI + {(1-cgpData.wUTI).toFixed(5)}×Conv = <strong style={{color:C.green}}>{fmtV(cgpData.cgp)}</strong></div>
              </div>
            </div>
          </div>
        )}

        {/* TAB 4: DRG Reports */}
        {tab === 4 && (
          <div>
            <div className="kpi-grid">
              <Pill label="C1 — Desperdício Eliminado" value={C1 ? fmtV(C1) : NA} color={C.orange} sub={C1 ? `${fmtN(agg.diarExc)} diárias × CGP ${fmtV(cgpData?.cgp||0)}` : null}/>
              <Pill label="C2 — Custo Evitado" value={C2 ? fmtV(C2) : NA} color={C.green} sub={C2 ? `${fmtN(agg.diarEvit)} diárias × CGP ${fmtV(cgpData?.cgp||0)}` : null}/>
              <Pill label="C3 — Bônus MG Hosp" value={C3 ? fmtV(C3) : NA} color={C.blue} sub={C3 ? `${nMonths} meses acumulados` : null}/>
              <Pill label="Total Consolidado" value={fmtV(TOTAL)} color={C.ink}/>
            </div>
            <div className="card">
              <SecTitle>Resumo do Período</SecTitle>
              <div className="kpi-grid">
                <Pill label="Altas Válidas" value={agg.totalAltas.toLocaleString("pt-BR")} color={C.ink}/>
                <Pill label="Diárias Realizadas" value={fmtN(agg.totalReal)} color={C.ink}/>
                <Pill label="Diárias Previstas" value={fmtN(agg.totalPrev)} color={C.ink}/>
                <Pill label="(In)Eficiência" value={inef ? pct(inef) : NA} color={statusColor}/>
              </div>
            </div>
            <div className="btn-group" style={{display:"flex",gap:10,marginTop:16}}>
              <button className="btn btn--primary" onClick={exportPDF} disabled={pdfLoading}>{pdfLoading ? "Gerando narrativas..." : "Exportar Relatório PDF"}</button>
              <button className="btn btn--secondary" onClick={() => copy(fmtV(TOTAL), "total")}>
                {copied==="total" ? "Copiado!" : "Copiar Total"}
              </button>
            </div>
          </div>
        )}


        {/* TAB 5: Tendência */}
        {tab === 5 && (
          <div>
            <div className="chart-wrap">
              <SecTitle>Ineficiência Mensal (%)</SecTitle>
              <ChartCanvas id="chart-inef" config={trendInefConfig} height={280}/>
            </div>
            <div className="chart-wrap">
              <SecTitle>Impacto Financeiro Mensal (R$)</SecTitle>
              <ChartCanvas id="chart-fin" config={trendFinConfig} height={280}/>
            </div>
          </div>
        )}

        {/* TAB 6: Comparativo */}
        {tab === 6 && (() => {
          const m1 = calcCycleMetrics(yoyCycle1);
          const m2 = calcCycleMetrics(yoyCycle2);
          const delta = (a, b) => b - a;
          const deltaPct = (a, b) => a > 0 ? ((b - a) / a * 100) : null;
          return (
            <div>
              <div className="card" style={{marginBottom:20}}>
                <SecTitle>Selecionar Ciclos</SecTitle>
                <div style={{display:"flex",gap:14,alignItems:"center"}}>
                  <select className="field__select" value={yoyCycle1} onChange={e => setYoyCycle1(e.target.value)}>
                    {[2024,2025,2026].map(y => <option key={y} value={y}>{y}</option>)}
                  </select>
                  <span style={{fontFamily:"var(--font-display)",fontWeight:700,color:"var(--u-stone)"}}>vs</span>
                  <select className="field__select" value={yoyCycle2} onChange={e => setYoyCycle2(e.target.value)}>
                    {[2024,2025,2026].map(y => <option key={y} value={y}>{y}</option>)}
                  </select>
                </div>
              </div>
              <div className="drg-table-wrap">
                <table className="drg-table">
                  <thead><tr><th>Métrica</th><th>{yoyCycle1}</th><th>{yoyCycle2}</th><th>Delta</th><th>%</th></tr></thead>
                  <tbody>
                    <tr><td>Altas Válidas</td><td data-label={yoyCycle1}>{m1.altas.toLocaleString("pt-BR")}</td><td data-label={yoyCycle2}>{m2.altas.toLocaleString("pt-BR")}</td><td data-label="Delta">{delta(m1.altas,m2.altas).toLocaleString("pt-BR")}</td><td data-label="%">{deltaPct(m1.altas,m2.altas)!==null?fmtN(deltaPct(m1.altas,m2.altas))+"%":NA}</td></tr>
                    <tr><td>Diárias Realizadas</td><td data-label={yoyCycle1}>{fmtN(m1.realizado)}</td><td data-label={yoyCycle2}>{fmtN(m2.realizado)}</td><td data-label="Delta">{fmtN(delta(m1.realizado,m2.realizado))}</td><td data-label="%">{deltaPct(m1.realizado,m2.realizado)!==null?fmtN(deltaPct(m1.realizado,m2.realizado))+"%":NA}</td></tr>
                    <tr><td>Diárias Previstas</td><td data-label={yoyCycle1}>{fmtN(m1.previsto)}</td><td data-label={yoyCycle2}>{fmtN(m2.previsto)}</td><td data-label="Delta">{fmtN(delta(m1.previsto,m2.previsto))}</td><td data-label="%">{deltaPct(m1.previsto,m2.previsto)!==null?fmtN(deltaPct(m1.previsto,m2.previsto))+"%":NA}</td></tr>
                    <tr><td>(In)Eficiência</td><td data-label={yoyCycle1}>{m1.inef?pct(m1.inef):NA}</td><td data-label={yoyCycle2}>{m2.inef?pct(m2.inef):NA}</td><td data-label="Delta" style={{color:m2.inef<m1.inef?C.green:C.red}}>{m1.inef&&m2.inef?fmtN(m2.inef-m1.inef)+" p.p.":NA}</td><td data-label="%">—</td></tr>
                    <tr><td>CGP</td><td data-label={yoyCycle1}>{fmtV(m1.cgp)}</td><td data-label={yoyCycle2}>{fmtV(m2.cgp)}</td><td data-label="Delta">{fmtV(delta(m1.cgp,m2.cgp))}</td><td data-label="%">{deltaPct(m1.cgp,m2.cgp)!==null?fmtN(deltaPct(m1.cgp,m2.cgp))+"%":NA}</td></tr>
                    <tr><td>C1 — Desperdício</td><td data-label={yoyCycle1}>{fmtV(m1.c1)}</td><td data-label={yoyCycle2}>{fmtV(m2.c1)}</td><td data-label="Delta">{fmtV(delta(m1.c1,m2.c1))}</td><td data-label="%">—</td></tr>
                    <tr><td>C2 — Custo Evitado</td><td data-label={yoyCycle1}>{fmtV(m1.c2)}</td><td data-label={yoyCycle2}>{fmtV(m2.c2)}</td><td data-label="Delta">{fmtV(delta(m1.c2,m2.c2))}</td><td data-label="%">—</td></tr>
                    <tr><td>C3 — Bônus</td><td data-label={yoyCycle1}>{fmtV(m1.c3)}</td><td data-label={yoyCycle2}>{fmtV(m2.c3)}</td><td data-label="Delta">{fmtV(delta(m1.c3,m2.c3))}</td><td data-label="%">{deltaPct(m1.c3,m2.c3)!==null?fmtN(deltaPct(m1.c3,m2.c3))+"%":NA}</td></tr>
                    <tr style={{fontWeight:700}}><td>Total</td><td data-label={yoyCycle1}>{fmtV(m1.total)}</td><td data-label={yoyCycle2}>{fmtV(m2.total)}</td><td data-label="Delta" style={{color:m2.total>m1.total?C.green:C.red}}>{fmtV(delta(m1.total,m2.total))}</td><td data-label="%">{deltaPct(m1.total,m2.total)!==null?fmtN(deltaPct(m1.total,m2.total))+"%":NA}</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          );
        })()}

        {/* TAB 7: Simulador */}
        {tab === 7 && (
          <div>
            <div className="card">
              <SecTitle>Parâmetros do Cenário</SecTitle>
              <TwoCol>
                <div>
                  <FieldN label="Enfermaria — Local" value={simParams.enfLocal} onChange={v => setSimParams(p=>({...p,enfLocal:v}))} mono/>
                  <FieldN label="Enfermaria — Intercâmbio" value={simParams.enfIC} onChange={v => setSimParams(p=>({...p,enfIC:v}))} mono/>
                  <FieldN label="Apartamento — Local" value={simParams.aptLocal} onChange={v => setSimParams(p=>({...p,aptLocal:v}))} mono/>
                  <FieldN label="Apartamento — Intercâmbio" value={simParams.aptIC} onChange={v => setSimParams(p=>({...p,aptIC:v}))} mono/>
                  <FieldN label="UTI — Local" value={simParams.utiLocal} onChange={v => setSimParams(p=>({...p,utiLocal:v}))} mono/>
                  <FieldN label="UTI — Intercâmbio" value={simParams.utiIC} onChange={v => setSimParams(p=>({...p,utiIC:v}))} mono/>
                </div>
                <div>
                  <FieldN label="Leitos Instalados" value={simParams.leitosInstalados} onChange={v => setSimParams(p=>({...p,leitosInstalados:v}))}/>
                  <FieldN label="Leitos Hospital Dia" value={simParams.leitosHD} onChange={v => setSimParams(p=>({...p,leitosHD:v}))}/>
                  <FieldN label="Leitos UTI" value={simParams.leitosUTI} onChange={v => setSimParams(p=>({...p,leitosUTI:v}))}/>
                  <FieldN label="Mix Apartamento (%)" value={simParams.mixApt} onChange={v => setSimParams(p=>({...p,mixApt:v}))}/>
                  <FieldN label="Meta Ineficiência (%)" value={simMeta} onChange={v => setSimMeta(v)} note="Referência visual"/>
                </div>
              </TwoCol>
            </div>

            <div className="card">
              <SecTitle>Resultado do Cenário</SecTitle>
              <div className="kpi-grid">
                <Pill label="CGP Simulado" value={simCgpData ? fmtV(simCgpData.cgp) : NA} color={C.green}/>
                <Pill label="C1 Simulado" value={simC1 ? fmtV(simC1) : NA} color={C.orange}/>
                <Pill label="C2 Simulado" value={simC2 ? fmtV(simC2) : NA} color={C.green}/>
                <Pill label="Total Simulado" value={fmtV(simTOTAL)} color={C.ink}/>
              </div>
              {cgpData && simCgpData && (
                <div className="card card--compact" style={{background:"var(--u-cloud)",border:"none",marginTop:12}}>
                  <div style={{fontFamily:"var(--font-display)",fontSize:12,color:"var(--u-stone)"}}>
                    <strong>Delta vs. Real:</strong>{" "}
                    <span style={{color: simTOTAL > TOTAL ? C.green : C.red, fontWeight:700}}>
                      {simTOTAL > TOTAL ? "+" : ""}{fmtV(simTOTAL - TOTAL)}
                    </span>
                    {" "}({simTOTAL > TOTAL ? "+" : ""}{((simTOTAL - TOTAL) / (TOTAL||1) * 100).toFixed(1)}%)
                  </div>
                </div>
              )}
            </div>
          </div>
        )}

      </div>

      {/* FOOTER */}
      <footer className="drg-footer">
        <div className="drg-footer__top">
          <div className="drg-footer__brand">
            <img src={LOGO_AXIA.horizontalNegativo} alt="AxiaCare" className="drg-footer__logo"/>
            <span className="drg-footer__slogan">Gestão em Saúde</span>
          </div>
          <span className="drg-footer__doc">Documento Interno &middot; Uso Restrito</span>
        </div>
        <div className="drg-footer__bottom">
          <div className="drg-footer__links">
            <a href="https://axcare.com.br" target="_blank" rel="noopener">axcare.com.br</a>
            <a href="https://grupocsv.com" target="_blank" rel="noopener">grupocsv.com</a>
            <a href="https://medvalor.med.br" target="_blank" rel="noopener">medvalor.med.br</a>
            <a href="https://thera.tech" target="_blank" rel="noopener">thera.tech</a>
          </div>
          <span className="drg-footer__copy">&copy; {new Date().getFullYear()} AxiaCare &middot; Grupo CSV. Resp. Técnico: Dr. Guilherme Thomé &middot; CRM-MG 64193 &middot; RQE 41538</span>
        </div>
      </footer>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("drg-root")).render(<DRGPlugin/>);
  </script>
  <script src="/scripts/hub-auth.js" data-portal="unimed" defer></script>
</body>
</html>
