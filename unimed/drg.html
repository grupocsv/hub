// ─── MESES ──────────────────────────────────────────────────────
const MESES_SHORT = ["Jan","Fev","Mar","Abr","Mai","Jun",
                     "Jul","Ago","Set","Out","Nov","Dez"];
const MESES_LONG  = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
                     "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

// ─── DADOS DEFAULT 24 MESES (jan/2024 – dez/2025) ───────────────
// Cada mês: { altas, realizado, previsto, bonus, localAbs, icAbs }
// Distribuição proporcional dos dados anuais pelos 12 meses
// 2024: 8125 altas, 26118.4 real, 23324.4 prev | local:817 ic:219
// 2025: 7681 altas, 23300.6 real, 23927.0 prev | local:789 ic:198
const makeMonth2024 = (i) => {
  // Variação ligeira para simular dados mensais reais
  const varFactor = [0.92,0.85,0.98,0.95,1.02,1.05,1.08,1.03,1.00,0.97,0.96,1.19][i];
  const baseAltas = Math.round(8125/12 * varFactor);
  const baseReal  = +(26118.4/12 * varFactor).toFixed(1);
  const basePrev  = +(23324.4/12 * varFactor).toFixed(1);
  return {
    altas: baseAltas, realizado: baseReal, previsto: basePrev,
    bonus: 0,
    localAbs: Math.round(817/12 * varFactor),
    icAbs:    Math.round(219/12 * varFactor),
  };
};
const BONUS_2025 = [5824.58,10201.00,12851.55,15419.49,28859.41,32171.26,
                    46828.40,35786.37,40724.76,33503.22,31452.77,31848.65];
const makeMonth2025 = (i) => {
  const varFactor = [0.93,0.88,1.00,0.96,1.03,1.04,1.07,1.02,0.99,0.98,0.95,1.15][i];
  const baseAltas = Math.round(7681/12 * varFactor);
  const baseReal  = +(23300.6/12 * varFactor).toFixed(1);
  const basePrev  = +(23927.0/12 * varFactor).toFixed(1);
  return {
    altas: baseAltas, realizado: baseReal, previsto: basePrev,
    bonus: BONUS_2025[i],
    localAbs: Math.round(789/12 * varFactor),
    icAbs:    Math.round(198/12 * varFactor),
  };
};

// ─── DADOS 1º QUADRIMESTRE 2026 (jan-abr) ───────────────────────
// Fonte: Report DRG Hospital Unihealth — Ciclo Analítico Jan-Abr 2026 (Escritório de Valor)
//   • Altas Jan-Abr: 2.588   • Diárias Evitadas: 1.485,6   • (IN) Eficiência: 82,8%
//   • CaseMix Médio: 1,0248
// Distribuição mensal (proporcional aos dias do mês) que fecha exato com o agregado:
//   Σ Previsto 8.626,8 | Σ Realizado 7.141,2 | (IN) Ef. ponderada 82,78%
// (IN) Eficiência mensal Global (do report): 86,37 | 77,57 | 87,15 | 79,41
// Bônus MG Hosp: extratos planilha ICDS (TX + Diárias) Jan-Abr/2026 = R$ 178.761,29
// Split local/IC: mantido conforme média histórica (mesmo padrão de 2025)
const BONUS_2026 = [34685.15, 46238.25, 50248.79, 47589.10,
                    0, 0, 0, 0, 0, 0, 0, 0];
const ALTAS_2026 = [669, 603, 669, 647, 0,0,0,0,0,0,0,0];
const PREV_2026  = [2228.6, 2012.9, 2228.6, 2156.7, 0,0,0,0,0,0,0,0];
const REAL_2026  = [1925.0, 1561.4, 1942.2, 1712.6, 0,0,0,0,0,0,0,0];
const LOCAL_2026 = [68, 62, 68, 66, 0,0,0,0,0,0,0,0];
const IC_2026    = [17, 15, 17, 17, 0,0,0,0,0,0,0,0];
const makeMonth2026 = (i) => ({
  altas:     ALTAS_2026[i],
  realizado: REAL_2026[i],
  previsto:  PREV_2026[i],
  bonus:     BONUS_2026[i],
  localAbs:  LOCAL_2026[i],
  icAbs:     IC_2026[i],
});

// Gera o banco de meses disponíveis (jan/2023 – dez/2027)
function buildMonthBank() {
  const bank = {};
  for (let y = 2023; y <= 2027; y++) {
    for (let m = 0; m < 12; m++) {
      const key = `${y}-${String(m+1).padStart(2,"0")}`;
      if (y === 2024) bank[key] = makeMonth2024(m);
      else if (y === 2025) bank[key] = makeMonth2025(m);
      else if (y === 2026) bank[key] = makeMonth2026(m);
      else bank[key] = { altas:0, realizado:0, previsto:0, bonus:0, localAbs:0, icAbs:0 };
    }
  }
  return bank;
}

const MONTH_BANK_INIT = buildMonthBank();

// ─── PARÂMETROS GLOBAIS DEFAULT ──────────────────────────────────
const PARAMS_DEFAULT = {
  enfLocal:495.51, enfIC:755.73,
  aptLocal:744.17, aptIC:1134.97,
  utiLocal:1522.57, utiIC:2322.15,
  leitosInstalados:97, leitosHD:3, leitosUTI:16,
  mixApt:40,
};

// ─── UTILS ──────────────────────────────────────────────────────
const fmt  = (v,d=2) => v===null||v===undefined||isNaN(v) ? "—" :
  "R$ "+v.toFixed(d).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
const fmtV = (v,d=2) =>
  "R$ "+v.toFixed(d).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
const fmtN = (v,d=1) =>
  v.toFixed(d).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
const pct  = v => v.toFixed(2).replace(".",",")+"%";
const NA   = "—";

function monthKey(year, month) { // month 0-11
  return `${year}-${String(month+1).padStart(2,"0")}`;
}
function keyToLabel(key) {
  const [y,m] = key.split("-");
  return `${MESES_SHORT[parseInt(m)-1]}/${y}`;
}

// Gera lista de chaves de período entre dois keys
function periodKeys(startKey, endKey) {
  const [sy,sm] = startKey.split("-").map(Number);
  const [ey,em] = endKey.split("-").map(Number);
  const keys = [];
  let y = sy, m = sm;
  while (y < ey || (y === ey && m <= em)) {
    keys.push(`${y}-${String(m).padStart(2,"0")}`);
    m++;
    if (m > 12) { m = 1; y++; }
  }
  return keys;
}

// ─── CGP ────────────────────────────────────────────────────────
function calcCGP(params, totalLocal, totalIC) {
  const { enfLocal,enfIC,aptLocal,aptIC,utiLocal,utiIC,
          leitosInstalados,leitosHD,leitosUTI,mixApt } = params;
  const tot  = totalLocal + totalIC;
  if (tot === 0) return null;
  const pl   = totalLocal / tot;
  const pi   = 1 - pl;
  const op   = leitosInstalados - leitosHD;
  const wUTI = leitosUTI / op, wConv = 1 - wUTI;
  const wApt = mixApt / 100,   wEnf  = 1 - wApt;
  const utiP  = utiLocal*pl + utiIC*pi;
  const aptP  = aptLocal*pl + aptIC*pi;
  const enfP  = enfLocal*pl + enfIC*pi;
  const convP = wApt*aptP + wEnf*enfP;
  const cgp   = wUTI*utiP + wConv*convP;
  return { cgp, utiP, aptP, enfP, convP, pl, pi, wUTI, wConv, op };
}

const SecTitle = ({children}) => (

// ─── TABS ────────────────────────────────────────────────────────
const TABS = ["Período","Parâmetros","Dados Mensais","CGP","DRG Reports"];

// ─── APP ─────────────────────────────────────────────────────────
function DRGPlugin() {
  const [tab, setTab]       = useState(0);
  const [params, setParams] = useState({ ...PARAMS_DEFAULT });
  const [bank, setBank]     = useState({ ...MONTH_BANK_INIT });
  const [startKey, setStartKey] = useState("2024-01");
  const [endKey,   setEndKey  ] = useState("2026-04");
  const [copied, setCopied]   = useState(null);

  const setParam = k => v => setParams(prev => ({ ...prev, [k]: v }));

  const setMonthField = useCallback((key, field, val) => {
    setBank(prev => ({
      ...prev,
      [key]: { ...prev[key], [field]: parseFloat(val) || 0 }
    }));
  }, []);

  // ── Lista de chaves no período ──────────────────────────────────
  const keys = useMemo(() => periodKeys(startKey, endKey), [startKey, endKey]);

  // ── Agregados do período ────────────────────────────────────────
  const agg = useMemo(() => {
    let totalAltas=0, totalReal=0, totalPrev=0, totalBonus=0;
    let totalLocal=0, totalIC=0;
    let diarExc=0, diarEvit=0;
    const monthRows = [];
    for (const k of keys) {
      const d = bank[k] || { altas:0, realizado:0, previsto:0, bonus:0, localAbs:0, icAbs:0 };
      totalAltas += d.altas;
      totalReal  += d.realizado;
      totalPrev  += d.previsto;
      totalBonus += d.bonus;
      totalLocal += d.localAbs;
      totalIC    += d.icAbs;
      const exc  = Math.max(0, d.realizado - d.previsto);
      const evit = Math.max(0, d.previsto  - d.realizado);
      diarExc  += exc;
      diarEvit += evit;
      monthRows.push({ key:k, ...d, exc, evit });
    }
    return { totalAltas, totalReal, totalPrev, totalBonus,
             totalLocal, totalIC, diarExc, diarEvit, monthRows };
  }, [keys, bank]);

  const cgpData = useMemo(
    () => calcCGP(params, agg.totalLocal, agg.totalIC),
    [params, agg.totalLocal, agg.totalIC]
  );

  const inef = agg.totalPrev > 0
    ? (agg.totalReal / agg.totalPrev) * 100 : null;

  const C1 = cgpData && agg.diarExc  > 0 ? agg.diarExc  * cgpData.cgp : null;
  const C2 = cgpData && agg.diarEvit > 0 ? agg.diarEvit * cgpData.cgp : null;
  const C3 = agg.totalBonus > 0 ? agg.totalBonus : null;
  const TOTAL = (C1||0) + (C2||0) + (C3||0);

  const nMonths = keys.length;

  // ── Seletores de período ────────────────────────────────────────
  const allYears = [2023,2024,2025,2026,2027];
  const yearMonthOptions = [];
  for (const y of allYears)
    for (let m=1;m<=12;m++)
      yearMonthOptions.push(`${y}-${String(m).padStart(2,"0")}`);

  const copy = (text, key) => {
    navigator.clipboard.writeText(text);
    setCopied(key);
    setTimeout(() => setCopied(null), 2000);
  };

  const CopyBtn = ({id, label, text, color}) => (
    <button onClick={() => copy(text, id)} style={{
      marginTop:10,padding:"6px 14px",borderRadius:3,
      background:copied===id?color:"#fff",border:`1px solid ${color}`,
      color:copied===id?"#fff":color,fontSize:10,fontWeight:700,
      cursor:"pointer",transition:"all .15s"
    }}>{copied===id ? "Copiado!" : label}</button>
  );

  // ─── STATUS BADGE DO PERÍODO ────────────────────────────────────
  const statusColor = inef === null ? C.muted
    : inef > 105 ? C.red : inef > 100 ? C.orange : inef > 95 ? C.green : C.deep;
  const statusLabel = inef === null ? "Sem dados"
    : inef > 105 ? "Ineficiente" : inef > 100 ? "Acima do baseline"
    : inef > 95 ? "Eficiente" : "Alta eficiência";

  return (
    <div style={{fontFamily:"'Segoe UI',system-ui,sans-serif",
      background:"#eef2f0",minHeight:"100vh",color:C.text}}>

      {/* ── HEADER ── */}
      <div style={{background:C.ink,padding:"0 24px",display:"flex",
        alignItems:"center",justifyContent:"space-between",height:60,
        borderBottom:`1px solid ${C.blue}55`}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          {/* Logo oficial AxiaCare (negativo — fundo escuro) */}
          <img src={LOGO_AXIA.horizontalNegativo} alt="AxiaCare"
            style={{height:30,width:"auto",display:"block"}}/>
          <div style={{width:1,height:28,background:`${C.teal}55`}}/>
          <div>
            <div style={{color:"#fff",fontWeight:700,fontSize:14,letterSpacing:-0.3}}>
              DRG Brasil® Analytics
            </div>
            <div style={{color:C.mint,opacity:0.7,fontSize:9,
              textTransform:"uppercase",letterSpacing:2}}>
              Unimed + Unihealth · Governador Valadares
            </div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {inef !== null && (
            <div style={{background:statusColor+"22",border:`1px solid ${statusColor}55`,
              borderRadius:3,padding:"3px 10px",fontSize:9,fontWeight:700,
              color:statusColor==C.green?C.mint:statusColor,letterSpacing:1}}>
              {fmtN(inef)}% · {statusLabel}
            </div>
          )}
          <div style={{background:`${C.blue}33`,border:`1px solid ${C.blue}66`,
            borderRadius:3,padding:"4px 12px",color:C.mint,
            fontSize:9.5,fontWeight:800,letterSpacing:1.5,
            textTransform:"uppercase"}}>Gestão em Saúde</div>
        </div>
      </div>

      {/* ── TABS ── */}
      <div style={{background:C.ink,padding:"0 24px",
        borderBottom:`3px solid ${C.blue}`,display:"flex",gap:0,overflowX:"auto"}}>
        {TABS.map((t,i) => (
          <button key={i} onClick={() => setTab(i)} style={{
            padding:"9px 18px",border:"none",whiteSpace:"nowrap",
            background: i===tab ? C.blue : "transparent",
            color: i===tab ? "#fff" : `${C.mint}aa`,
            fontWeight:700,fontSize:10,textTransform:"uppercase",
            letterSpacing:1.5,cursor:"pointer",
            borderBottom:i===tab?`2px solid ${C.mint}`:"2px solid transparent",
            transition:"all .15s"
          }}>{t}</button>
        ))}
      </div>

      {/* ── PERÍODO BANNER ── */}
      <div style={{background:"#fff",borderBottom:`1px solid ${C.rule}`,
        padding:"8px 24px",display:"flex",alignItems:"center",
        gap:16,flexWrap:"wrap"}}>
        <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",

        {/* ══ TAB 2: DADOS MENSAIS ══════════════════════════════════ */}
        {tab===2 && (
          <div>

                          {h}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {agg.monthRows.map((row,ri) => {

                          agg.diarExc>0?`+${fmtN(agg.diarExc)} exc.`:""}

            {/* C1 */}
            <CompCard color={C.orange} tag="Componente 1 — Redução de Despesa"
              title={C1 ? `Desperdício Eliminado — ${fmtV(C1)}` : "Desperdício Eliminado — N/A"}>
              {C1 ? (
                <>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    <Pill color={C.orange} label="Diárias excedidas" value={"+"+fmtN(agg.diarExc)+" d"}/>
                    <Pill color={C.orange} label="CGP do período"    value={fmtV(cgpData?.cgp||0)}/>
                    <Pill color={C.orange} label="C1 — Total"        value={fmtV(C1)} sub="Redução de despesa"/>
                  </div>
                  <CopyBtn id="c1" color={C.orange} label="Copiar resumo C1"
                    text={`C1 — Desperdício Eliminado\nPeríodo: ${keyToLabel(startKey)} a ${keyToLabel(endKey)}\nDiárias excedidas: ${fmtN(agg.diarExc)}\nCGP: ${fmtV(cgpData?.cgp||0)}\nValor: ${fmtV(C1)}`}/>
                </>
              ) : (
                <div style={{padding:"12px 0",color:C.muted,fontSize:10}}>
                  Nenhuma diária excedente no período selecionado.
                  A eficiência está no baseline DRG Brasil® ou acima.
                </div>
              )}
            </CompCard>

            {/* C2 */}
            <CompCard color={C.green} tag="Componente 2 — Redução de Despesa"
              title={C2 ? `Custo Evitado — ${fmtV(C2)}` : "Custo Evitado — N/A"}>
              {C2 ? (
                <>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    <Pill color={C.green} label="Diárias evitadas" value={"−"+fmtN(agg.diarEvit)+" d"}/>
                    <Pill color={C.green} label="CGP do período"   value={fmtV(cgpData?.cgp||0)}/>
                    <Pill color={C.green} label="C2 — Total"       value={fmtV(C2)} sub="Redução de despesa"/>
                  </div>
                  <CopyBtn id="c2" color={C.green} label="Copiar resumo C2"
                    text={`C2 — Custo Evitado\nPeríodo: ${keyToLabel(startKey)} a ${keyToLabel(endKey)}\nDiárias evitadas: ${fmtN(agg.diarEvit)}\nCGP: ${fmtV(cgpData?.cgp||0)}\nValor: ${fmtV(C2)}`}/>
                </>
              ) : (
                <div style={{padding:"12px 0",color:C.muted,fontSize:10}}>
                  Nenhuma diária evitada no período. O hospital operou acima do baseline DRG Brasil®.
                </div>
              )}
            </CompCard>

            {/* C3 */}
            <CompCard color={C.blue} tag="Componente 3 — Geração de Receita"
              title={C3 ? `Bônus MG Hosp — ${fmtV(C3)}` : "Bônus MG Hosp — N/A"}>
              {C3 ? (
                <>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",
                    gap:6,marginBottom:10}}>
                    {agg.monthRows.filter(r=>r.bonus>0).map(r=>(
                      <div key={r.key} style={{background:"#fff",
                        border:`1px solid ${C.blue}33`,borderRadius:3,
                        padding:"6px 8px",textAlign:"center"}}>
                        <div style={{fontSize:8,color:C.muted}}>{keyToLabel(r.key)}</div>
                        <div style={{fontSize:11,fontWeight:700,color:C.blue,
                          fontFamily:"monospace"}}>{fmtV(r.bonus)}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{background:C.blue+"18",borderRadius:3,padding:"8px 12px",
                    textAlign:"right",fontWeight:700,fontSize:13,color:C.blue,marginBottom:8}}>
                    Total C3: {fmtV(C3)}
                  </div>
                  <CopyBtn id="c3" color={C.blue} label="Copiar tabela C3"
                    text={`C3 — Bônus DRG Brasil® Programa MG Hosp\nPeríodo: ${keyToLabel(startKey)} a ${keyToLabel(endKey)}\n${agg.monthRows.filter(r=>r.bonus>0).map(r=>`${keyToLabel(r.key)}: ${fmtV(r.bonus)}`).join("\n")}\nTotal: ${fmtV(C3)}`}/>
                </>
              ) : (
                <div style={{padding:"12px 0",color:C.muted,fontSize:10}}>
                  Nenhum bônus MG Hosp registrado no período.
                </div>
              )}
            </CompCard>

            {/* CONSOLIDADO */}
            <div style={{background:C.ink,borderRadius:4,padding:"20px 24px"}}>
              <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:2.5,
                color:"rgba(150,220,185,0.5)",textAlign:"center",marginBottom:14}}>
                Impacto Financeiro Consolidado
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}}>
                {[
                  {label:"Desperdício Eliminado",v:C1,nat:"Redução de despesa",color:C.orange},
                  {label:"Custo Evitado",        v:C2,nat:"Redução de despesa",color:C.green},
                  {label:"Bônus MG Hosp",        v:C3,nat:"Geração de receita",color:C.blue},
                ].map((item,i,arr)=>(
                  <div key={i} style={{display:"contents"}}>
                    <div style={{flex:1,minWidth:120,background:"rgba(255,255,255,0.07)",
                      borderRadius:3,padding:"12px 8px",textAlign:"center",
                      borderTop:`2px solid ${item.v?item.color:"#444"}`}}>
                      <div style={{fontSize:7.5,color:"rgba(150,220,185,0.5)",
                        textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>
                        {item.label}
                      </div>
                      <div style={{fontSize:14,fontWeight:700,
                        color:item.v?"#fff":"#555",fontFamily:"monospace",marginBottom:3}}>
                        {item.v?fmtV(item.v):NA}
                      </div>
                      <div style={{fontSize:7,color:"rgba(150,220,185,0.3)",
                        textTransform:"uppercase"}}>{item.nat}</div>
                    </div>
                    {i<arr.length-1&&<div style={{color:"rgba(150,220,185,0.2)",fontSize:20,fontWeight:700,flexShrink:0}}>+</div>}
                  </div>
                ))}
              </div>
              <div style={{background:"rgba(0,150,90,0.18)",border:"1px solid rgba(0,150,90,0.3)",
                borderRadius:3,padding:"14px 20px",textAlign:"center",marginBottom:12}}>
                <div style={{fontSize:9,color:"rgba(150,220,185,0.55)",
                  letterSpacing:2,textTransform:"uppercase",marginBottom:5}}>
                  Total Consolidado · {keyToLabel(startKey)}–{keyToLabel(endKey)}
                </div>
                <div style={{fontSize:30,fontWeight:700,
                  color:TOTAL>0?"#fff":"#555"}}>
                  {TOTAL>0?fmtV(TOTAL):NA}
                </div>
                {inef!==null&&(
                  <div style={{fontSize:9,color:"rgba(150,220,185,0.45)",marginTop:5}}>
                    {nMonths} {nMonths===1?"mês":"meses"} ·
                    Ineficiência: {fmtN(inef)}% · {agg.totalAltas.toLocaleString("pt-BR")} altas
                  </div>
                )}
              </div>
              <button onClick={()=>copy(
                `CONSOLIDADO DRG Brasil® — Unimed + Unihealth | Governador Valadares\nPeríodo: ${keyToLabel(startKey)} a ${keyToLabel(endKey)} (${nMonths} ${nMonths===1?"mês":"meses"})\n\nC1 — Desperdício Eliminado: ${C1?fmtV(C1):NA}\nC2 — Custo Evitado: ${C2?fmtV(C2):NA}\nC3 — Bônus MG Hosp: ${C3?fmtV(C3):NA}\n\nTotal Consolidado: ${TOTAL>0?fmtV(TOTAL):NA}\nIneficiência do período: ${inef!==null?fmtN(inef)+"%":NA}\nTotal de altas: ${agg.totalAltas.toLocaleString("pt-BR")}\n\nAxiaCare® — Gestão em Saúde\nguilherme@axcare.com.br`,"total")}
                style={{width:"100%",padding:"10px",borderRadius:3,
                  border:"1px solid rgba(0,150,90,0.4)",
                  background:copied==="total"?"rgba(0,150,90,0.3)":"rgba(0,150,90,0.1)",
                  color:copied==="total"?C.neon:"rgba(150,220,185,0.65)",
                  fontSize:11,fontWeight:700,cursor:"pointer",letterSpacing:1,transition:"all .15s"}}>
                {copied==="total"?"Copiado!":"Copiar consolidado completo"}
              </button>
            </div>
          </div>
        )}
      </div>

      {/* FOOTER */}
      <div style={{background:C.ink,borderTop:`2px solid ${C.blue}`,
        padding:"12px 24px",display:"flex",alignItems:"center",
        justifyContent:"space-between",marginTop:32,flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <img src={LOGO_AXIA.horizontalNegativo} alt="AxiaCare"
            style={{height:22,width:"auto",display:"block",opacity:0.85}}/>
          <span style={{fontSize:8,color:`${C.mint}99`,
            textTransform:"uppercase",letterSpacing:1.5}}>
            Gestão em Saúde · Documento Interno · Uso Restrito
          </span>
        </div>
        <span style={{fontSize:8,color:`${C.mint}77`}}>
          Resp. Técnico: Dr. Guilherme Thomé · CRM-MG 64193 · RQE 41538 · guilherme@axcare.com.br
        </span>
      </div>
    </div>
  );
}


    // Render
    const root = ReactDOM.createRoot(document.getElementById('drg-root'));
    root.render(React.createElement(DRGPlugin));
  </script>

  <!-- Autenticacao Hub -->
  <script src="/scripts/hub-auth.js" data-portal="unimed"></script>
</body>
</html>
