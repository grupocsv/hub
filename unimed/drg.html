function buildMonthBank() {
  const bank = {};
  for (let y = 2023; y <= 2027; y++) {
    for (let m = 0; m < 12; m++) {
      const key = `${y}-${String(m+1).padStart(2,"0")}`;
      if (y === 2024) bank[key] = makeMonth2024(m);
      else if (y === 2025) bank[key] = makeMonth2025(m);
      else if (y === 2026) bank[key] = makeMonth2026(m);
      else bank[key] = { altas:0, realizado:0, previsto:0, bonus:0, localAbs:0, icAbs:0, hasData:false };
    }
  }
  return bank;
}

function monthKey(year, month) {

function keyToLabel(key) {
  const [y,m] = key.split("-");
  return `${MESES_SHORT[parseInt(m)-1]}/${y}`;
}

function periodKeys(startKey, endKey) {
  const [sy,sm] = startKey.split("-").map(Number);
  const [ey,em] = endKey.split("-").map(Number);
  const keys = [];
  let y = sy, m = sm;
  while (y < ey || (y === ey && m <= em)) {
    keys.push(`${y}-${String(m).padStart(2,"0")}`);
    m++;
    if (m > 12) { m = 1; y++; }
  }
  return keys;
}

// ─── CGP ────────────────────────────────────────────────────────
function calcCGP(params, totalLocal, totalIC) {
  const { enfLocal,enfIC,aptLocal,aptIC,utiLocal,utiIC,
          leitosInstalados,leitosHD,leitosUTI,mixApt } = params;
  const tot  = totalLocal + totalIC;
  if (tot === 0) return null;
  const pl   = totalLocal / tot;
  const pi   = 1 - pl;
  const op   = leitosInstalados - leitosHD;
  if (op === 0) return null;
  const wUTI = leitosUTI / op, wConv = 1 - wUTI;
  const wApt = mixApt / 100,   wEnf  = 1 - wApt;
  const utiP  = utiLocal*pl + utiIC*pi;
  const aptP  = aptLocal*pl + aptIC*pi;
  const enfP  = enfLocal*pl + enfIC*pi;
  const convP = wApt*aptP + wEnf*enfP;
  const cgp   = wUTI*utiP + wConv*convP;
  return { cgp, utiP, aptP, enfP, convP, pl, pi, wUTI, wConv, op };
}

};

// ─── APP ─────────────────────────────────────────────────────
function DRGPlugin() {
  // ── State initialization with localStorage fallback ──────────
  const saved = useMemo(() => lsLoad(), []);
  const [tab, setTab]       = useState(0);
  const [params, setParams] = useState(saved?.params || { ...PARAMS_DEFAULT });
  const [bank, setBank]     = useState(saved?.bank || { ...MONTH_BANK_INIT });
  const [startKey, setStartKey] = useState(saved?.startKey || "2024-01");
  const [endKey,   setEndKey  ] = useState(saved?.endKey || "2026-04");
  const [copied, setCopied]   = useState(null);
  const [supaStatus, setSupaStatus] = useState("idle"); // idle|loading|saved|error
  const [dataSource, setDataSource] = useState("local"); // local|supabase

  // ── M1: Auto-save to localStorage ──────────────────────────────
  useEffect(() => {
    lsSave({ params, bank, startKey, endKey });
  }, [params, bank, startKey, endKey]);

  // ── M1: Reset to defaults ──────────────────────────────────────
  const resetToDefaults = () => {
    setParams({ ...PARAMS_DEFAULT });
    setBank({ ...MONTH_BANK_INIT });
    setStartKey("2024-01");
    setEndKey("2026-04");
    lsClear();
    setDataSource("local");
  };

  const setParam = k => v => setParams(prev => ({ ...prev, [k]: v }));

  const setMonthField = useCallback((key, field, val) => {
    setBank(prev => ({
      ...prev,
      [key]: { ...prev[key], [field]: parseFloat(val) || 0, hasData: true }
    }));
  }, []);

  // ── Lista de chaves no periodo ──────────────────────────────────
  const keys = useMemo(() => periodKeys(startKey, endKey), [startKey, endKey]);

  // ── Agregados do periodo ────────────────────────────────────────
  const agg = useMemo(() => {
    let totalAltas=0, totalReal=0, totalPrev=0, totalBonus=0;
    let totalLocal=0, totalIC=0;
    let diarExc=0, diarEvit=0;
    const monthRows = [];
    for (const k of keys) {
      const d = bank[k] || { altas:0, realizado:0, previsto:0, bonus:0, localAbs:0, icAbs:0 };
      totalAltas += d.altas;
      totalReal  += d.realizado;
      totalPrev  += d.previsto;
      totalBonus += d.bonus;
      totalLocal += d.localAbs;
      totalIC    += d.icAbs;
      const exc  = Math.max(0, d.realizado - d.previsto);
      const evit = Math.max(0, d.previsto  - d.realizado);
      diarExc  += exc;
      diarEvit += evit;
      monthRows.push({ key:k, ...d, exc, evit });
    }
    return { totalAltas, totalReal, totalPrev, totalBonus,
             totalLocal, totalIC, diarExc, diarEvit, monthRows };
  }, [keys, bank]);

  const cgpData = useMemo(
    () => calcCGP(params, agg.totalLocal, agg.totalIC),
    [params, agg.totalLocal, agg.totalIC]
  );

  const inef = agg.totalPrev > 0
    ? (agg.totalReal / agg.totalPrev) * 100 : null;

  const C1 = cgpData && agg.diarExc  > 0 ? agg.diarExc  * cgpData.cgp : null;
  const C2 = cgpData && agg.diarEvit > 0 ? agg.diarEvit * cgpData.cgp : null;
  const C3 = agg.totalBonus > 0 ? agg.totalBonus : null;
  const TOTAL = (C1||0) + (C2||0) + (C3||0);

  const nMonths = keys.length;

  // ── Seletores de periodo ────────────────────────────────────────
  const allYears = [2023,2024,2025,2026,2027];
  const yearMonthOptions = [];
  for (const y of allYears)
    for (let m=1;m<=12;m++)
      yearMonthOptions.push(`${y}-${String(m).padStart(2,"0")}`);

  const copy = (text, key) => {
    navigator.clipboard.writeText(text);
    setCopied(key);
    setTimeout(() => setCopied(null), 2000);
  };

  const CopyBtn = ({id, label, text, color}) => (
    <button onClick={() => copy(text, id)} style={{
      marginTop:10,padding:"6px 14px",borderRadius:3,
      background:copied===id?color:"#fff",border:`1px solid ${color}`,
      color:copied===id?"#fff":color,fontSize:10,fontWeight:700,
      cursor:"pointer",transition:"all .15s"
    }}>{copied===id ? "Copiado!" : label}</button>
  );

  // ── Status badge do periodo ─────────────────────────────────────
  const statusColor = inef === null ? C.muted
    : inef > 105 ? C.red : inef > 100 ? C.orange : inef > 95 ? C.green : C.deep;
  const statusLabel = inef === null ? "Sem dados"
    : inef > 105 ? "Ineficiente" : inef > 100 ? "Acima do baseline"
    : inef > 95 ? "Eficiente" : "Alta eficiência";

  // ── M5: Comparativo YoY helpers ─────────────────────────────────
  const [yoyCycle1, setYoyCycle1] = useState("2024");
  const [yoyCycle2, setYoyCycle2] = useState("2025");

  const calcCycleMetrics = (year) => {
    const ks = periodKeys(`${year}-01`, `${year}-12`);
    let tAltas=0,tReal=0,tPrev=0,tBonus=0,tLocal=0,tIC=0,dExc=0,dEvit=0;
    for (const k of ks) {
      const d = bank[k] || {};
      tAltas += d.altas||0; tReal += d.realizado||0; tPrev += d.previsto||0;
      tBonus += d.bonus||0; tLocal += d.localAbs||0; tIC += d.icAbs||0;
      dExc += Math.max(0,(d.realizado||0)-(d.previsto||0));
      dEvit += Math.max(0,(d.previsto||0)-(d.realizado||0));
    }
    const cgp = calcCGP(params, tLocal, tIC);
    const c1 = cgp && dExc > 0 ? dExc * cgp.cgp : 0;
    const c2 = cgp && dEvit > 0 ? dEvit * cgp.cgp : 0;
    const c3 = tBonus;
    const total = c1 + c2 + c3;
    const inefPct = tPrev > 0 ? (tReal/tPrev)*100 : null;
    return { altas:tAltas, realizado:tReal, previsto:tPrev, inef:inefPct,
             c1, c2, c3, total, cgp: cgp?.cgp||0 };
  };

  // ── M6: Simulador What-If ───────────────────────────────────────
  const [simParams, setSimParams] = useState({ ...PARAMS_DEFAULT });
  const [simMeta, setSimMeta] = useState(95); // meta de ineficiencia %

  const simCgpData = useMemo(
    () => calcCGP(simParams, agg.totalLocal, agg.totalIC),
    [simParams, agg.totalLocal, agg.totalIC]
  );
  const simC1 = simCgpData && agg.diarExc > 0 ? agg.diarExc * simCgpData.cgp : null;
  const simC2 = simCgpData && agg.diarEvit > 0 ? agg.diarEvit * simCgpData.cgp : null;
  const simTOTAL = (simC1||0) + (simC2||0) + (C3||0);

  // ── M7: Supabase integration ────────────────────────────────────
  const saveToSupabase = async () => {
    if (!supabaseClient) { setSupaStatus("error"); return; }
    setSupaStatus("loading");

        .from("drg_configs")
        .upsert({ config_name: "default", params: params, description: "Configuracao padrao DRG Analytics", is_active: true, updated_at: new Date().toISOString() }, { onConflict: "config_name" })
        .select().single();
      if (cfgErr) throw cfgErr;
      const configId = cfgData.id;

      // Upsert monthly data
      const rows = Object.entries(bank).map(([mk, d]) => ({
        config_id: configId,
        month_key: mk,
        altas: d.altas || 0,
        realizado: d.realizado || 0,
        previsto: d.previsto || 0,
        bonus: d.bonus || 0,
        local_abs: d.localAbs || 0,
        ic_abs: d.icAbs || 0,
        has_data: d.hasData || false,
        source: "manual",
        updated_at: new Date().toISOString(),
      }));
      // Batch in chunks of 50
      for (let i = 0; i < rows.length; i += 50) {
        const chunk = rows.slice(i, i + 50);
        const { error: mdErr } = await supabaseClient
          .from("drg_monthly_data")
          .upsert(chunk, { onConflict: "config_id,month_key" });
        if (mdErr) throw mdErr;
      }

      // Save snapshot
      const { error: snapErr } = await supabaseClient
        .from("drg_snapshots")
        .insert({
          config_id: configId,
          period_start: startKey,
          period_end: endKey,
          n_months: nMonths,
          c1_value: C1 || 0,
          c2_value: C2 || 0,
          c3_value: C3 || 0,

          inef_pct: inef,
          cgp_value: cgpData?.cgp || 0,
          params_snapshot: params,
          monthly_data_snapshot: bank,
        });
      if (snapErr) throw snapErr;

      setSupaStatus("saved");
      setDataSource("supabase");
      setTimeout(() => setSupaStatus("idle"), 3000);
    } catch(e) {
      console.error("Erro ao salvar no Supabase:", e);
      setSupaStatus("error");
      setTimeout(() => setSupaStatus("idle"), 5000);
    }
  };

                Fórmula: C2 = diárias evitadas × CGP = {fmtN(agg.diarEvit)} × {cgpData?fmtV(cgpData.cgp):NA}
              </div>
              <CopyBtn id="c2" label="Copiar C2" color={C.green}
                text={`C2 — Custo Evitado\nDiárias evitadas: −${fmtN(agg.diarEvit)}\nCGP: ${cgpData?fmtV(cgpData.cgp):NA}\nTotal C2: ${C2?fmtV(C2):NA}`}/>
            </CompCard>

            {/* C3 */}
            <CompCard color={C.blue} tag="C3" title={`Bônus MG Hosp: ${C3?fmtV(C3):NA}`}>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {agg.monthRows.filter(r=>r.bonus>0).map(r=>(
                  <Pill key={r.key} label={keyToLabel(r.key)}
                    value={fmtV(r.bonus)} color={C.blue}/>
                ))}
              </div>
              <div style={{marginTop:8,textAlign:"right",fontWeight:700,
                fontSize:13,color:C.blue}}>Total C3: {C3?fmtV(C3):NA}</div>
              <CopyBtn id="c3" label="Copiar C3" color={C.blue}
                text={`C3 — Bônus MG Hosp\n${agg.monthRows.filter(r=>r.bonus>0).map(r=>`${keyToLabel(r.key)}: ${fmtV(r.bonus)}`).join("\n")}\nTotal C3: ${C3?fmtV(C3):NA}`}/>
            </CompCard>

            {/* CONSOLIDADO */}
            <div style={{background:C.ink,borderRadius:4,padding:"20px 24px"}}>
              <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:2.5,
                color:"rgba(150,220,185,0.5)",textAlign:"center",marginBottom:14}}>
                Impacto Financeiro Consolidado
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}}>
                {[
                  {label:"Desperdício Eliminado",v:C1,nat:"Redução de despesa",color:C.orange},
                  {label:"Custo Evitado",        v:C2,nat:"Redução de despesa",color:C.green},
                  {label:"Bônus MG Hosp",        v:C3,nat:"Geração de receita",color:C.blue},
                ].map((item,i,arr)=>(
                  <div key={i} style={{display:"contents"}}>
                    <div style={{flex:1,minWidth:120,background:"rgba(255,255,255,0.07)",
                      borderRadius:3,padding:"12px 8px",textAlign:"center",
                      borderTop:`2px solid ${item.v?item.color:"#444"}`}}>
                      <div style={{fontSize:7.5,color:"rgba(150,220,185,0.5)",
                        textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>
                        {item.label}
                      </div>
                      <div style={{fontSize:14,fontWeight:700,
                        color:item.v?"#fff":"#555",fontFamily:"monospace",marginBottom:3}}>
                        {item.v?fmtV(item.v):NA}
                      </div>
                      <div style={{fontSize:7,color:"rgba(150,220,185,0.3)",
                        textTransform:"uppercase"}}>{item.nat}</div>
                    </div>
                    {i<arr.length-1&&<div style={{color:"rgba(150,220,185,0.2)",fontSize:20,fontWeight:700,flexShrink:0}}>+</div>}
                  </div>
                ))}
              </div>
              <div style={{background:"rgba(0,150,90,0.18)",border:"1px solid rgba(0,150,90,0.3)",
                borderRadius:3,padding:"14px 20px",textAlign:"center",marginBottom:12}}>
                <div style={{fontSize:9,color:"rgba(150,220,185,0.55)",
                  letterSpacing:2,textTransform:"uppercase",marginBottom:5}}>
                  Total Consolidado &middot; {keyToLabel(startKey)}&ndash;{keyToLabel(endKey)}
                </div>
                <div style={{fontSize:30,fontWeight:700,
                  color:TOTAL>0?"#fff":"#555"}}>
                  {TOTAL>0?fmtV(TOTAL):NA}
                </div>
                {inef!==null&&(
                  <div style={{fontSize:9,color:"rgba(150,220,185,0.45)",marginTop:5}}>
                    {nMonths} {nMonths===1?"mês":"meses"} &middot;
                    Ineficiência: {fmtN(inef)}% &middot; {agg.totalAltas.toLocaleString("pt-BR")} altas
                  </div>
                )}
              </div>

              {/* Action buttons */}
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <button onClick={()=>copy(
                  `CONSOLIDADO DRG Brasil® — Unimed + Unihealth | Governador Valadares\nPeríodo: ${keyToLabel(startKey)} a ${keyToLabel(endKey)} (${nMonths} ${nMonths===1?"mês":"meses"})\n\nC1 — Desperdício Eliminado: ${C1?fmtV(C1):NA}\nC2 — Custo Evitado: ${C2?fmtV(C2):NA}\nC3 — Bônus MG Hosp: ${C3?fmtV(C3):NA}\n\nTotal Consolidado: ${TOTAL>0?fmtV(TOTAL):NA}\nIneficiência do período: ${inef!==null?fmtN(inef)+"%":NA}\nTotal de altas: ${agg.totalAltas.toLocaleString("pt-BR")}\n\nAxiaCare® — Gestão em Saúde\nguilherme@axcare.com.br`,"total")}
                  style={{flex:1,padding:"10px",borderRadius:3,
                    border:"1px solid rgba(0,150,90,0.4)",
                    background:copied==="total"?"rgba(0,150,90,0.3)":"rgba(0,150,90,0.1)",
                    color:copied==="total"?C.neon:"rgba(150,220,185,0.65)",
                    fontSize:11,fontWeight:700,cursor:"pointer",letterSpacing:1,transition:"all .15s"}}>
                  {copied==="total"?"Copiado!":"Copiar consolidado"}
                </button>
                <button onClick={exportPDF}
                  style={{flex:1,padding:"10px",borderRadius:3,
                    border:`1px solid ${C.blue}66`,
                    background:`${C.blue}22`,
                    color:C.mint,
                    fontSize:11,fontWeight:700,cursor:"pointer",letterSpacing:1,transition:"all .15s"}}>
                  Exportar PDF
                </button>
              </div>
            </div>
          </div>
        )}


        {/* ══ TAB 5: TENDENCIA ═════════════════════════════════════ */}
        {tab===5 && (
          <div>
            <SecTitle>Tend&ecirc;ncia Temporal &mdash; Inefici&ecirc;ncia Mensal</SecTitle>
            <div style={{background:"#fff",border:`1px solid ${C.rule}`,
              borderRadius:4,padding:"16px 20px",marginBottom:20}}>
              <ChartCanvas id="chart-inef" config={trendInefConfig} height={280}/>
              <div style={{marginTop:8,fontSize:9,color:C.muted}}>
                Meses com barra acima da linha pontilhada (100%) indicam inefici&ecirc;ncia.
                Meses sem dados n&atilde;o s&atilde;o plotados.
              </div>
            </div>

            <SecTitle>Impacto Financeiro Mensal (Empilhado)</SecTitle>
            <div style={{background:"#fff",border:`1px solid ${C.rule}`,
              borderRadius:4,padding:"16px 20px"}}>
              <ChartCanvas id="chart-fin" config={trendFinConfig} height={280}/>
              <div style={{marginTop:8,fontSize:9,color:C.muted}}>
                Composi&ccedil;&atilde;o mensal: C1 (desperd&iacute;cio eliminado), C2 (custo evitado) e C3 (b&ocirc;nus MG Hosp).
              </div>
            </div>
          </div>
        )}

        {/* ══ TAB 6: COMPARATIVO ANO-A-ANO ═════════════════════════ */}
        {tab===6 && (() => {
          const m1 = calcCycleMetrics(yoyCycle1);
          const m2 = calcCycleMetrics(yoyCycle2);
          const delta = (a,b) => b !== 0 ? ((a-b)/Math.abs(b))*100 : null;
          const DeltaCell = ({v1,v2,fmt:fmtFn,invert}) => {
            const d = delta(v2,v1);
            const better = invert ? d < 0 : d > 0;
            return (
              <td style={{padding:"8px 10px",textAlign:"right",fontFamily:"monospace",fontSize:10,
                borderBottom:`1px solid ${C.rule}`}}>
                {d !== null ? (
                  <span style={{color:better?C.green:C.red,fontWeight:700}}>
                    {d > 0 ? "+" : ""}{fmtN(d)}%
                  </span>
                ) : NA}
              </td>
            );
          };
          const rows = [
            {label:"Altas válidas", v1:m1.altas, v2:m2.altas, fmt:v=>v.toLocaleString("pt-BR")},
            {label:"Diárias realizadas", v1:m1.realizado, v2:m2.realizado, fmt:v=>fmtN(v)+" d", invert:true},
            {label:"Diárias previstas", v1:m1.previsto, v2:m2.previsto, fmt:v=>fmtN(v)+" d"},
            {label:"Ineficiência", v1:m1.inef, v2:m2.inef, fmt:v=>v?fmtN(v)+"%":NA, invert:true},
            {label:"CGP", v1:m1.cgp, v2:m2.cgp, fmt:v=>fmtV(v)},
            {label:"C1 — Desperdício", v1:m1.c1, v2:m2.c1, fmt:v=>fmtV(v), invert:true},
            {label:"C2 — Custo Evitado", v1:m1.c2, v2:m2.c2, fmt:v=>fmtV(v)},
            {label:"C3 — Bônus", v1:m1.c3, v2:m2.c3, fmt:v=>fmtV(v)},
            {label:"Total Consolidado", v1:m1.total, v2:m2.total, fmt:v=>fmtV(v)},
          ];
          return (
            <div>
              <SecTitle>Comparativo Ano-a-Ano</SecTitle>
              <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
                {[2024,2025,2026].map(y => (
                  <div key={y} style={{display:"flex",gap:6}}>
                    <button onClick={()=>setYoyCycle1(String(y))} style={{
                      padding:"5px 12px",borderRadius:3,fontSize:10,fontWeight:700,cursor:"pointer",
                      background:yoyCycle1===String(y)?C.ink:"#fff",
                      color:yoyCycle1===String(y)?"#fff":C.text,
                      border:`1px solid ${C.rule}`}}>
                      {y} (A)
                    </button>
                    <button onClick={()=>setYoyCycle2(String(y))} style={{
                      padding:"5px 12px",borderRadius:3,fontSize:10,fontWeight:700,cursor:"pointer",
                      background:yoyCycle2===String(y)?C.blue:"#fff",
                      color:yoyCycle2===String(y)?"#fff":C.text,
                      border:`1px solid ${C.rule}`}}>
                      {y} (B)
                    </button>
                  </div>
                ))}
              </div>

              <div style={{background:"#fff",border:`1px solid ${C.rule}`,borderRadius:4,overflow:"hidden"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                  <thead>
                    <tr style={{background:C.ink}}>
                      <th style={{padding:"9px 10px",textAlign:"left",color:"rgba(200,240,220,0.8)",
                        fontSize:8,textTransform:"uppercase",letterSpacing:1}}>M&eacute;trica</th>
                      <th style={{padding:"9px 10px",textAlign:"right",color:"rgba(200,240,220,0.8)",
                        fontSize:8,textTransform:"uppercase",letterSpacing:1}}>{yoyCycle1} (A)</th>
                      <th style={{padding:"9px 10px",textAlign:"right",color:"rgba(200,240,220,0.8)",
                        fontSize:8,textTransform:"uppercase",letterSpacing:1}}>{yoyCycle2} (B)</th>
                      <th style={{padding:"9px 10px",textAlign:"right",color:"rgba(200,240,220,0.8)",
                        fontSize:8,textTransform:"uppercase",letterSpacing:1}}>Delta</th>
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((r,i) => (
                      <tr key={i} style={{background:i%2===0?"#fff":"#f8faf8"}}>
                        <td style={{padding:"8px 10px",fontWeight:700,color:C.ink,
                          borderBottom:`1px solid ${C.rule}`}}>{r.label}</td>
                        <td style={{padding:"8px 10px",textAlign:"right",fontFamily:"monospace",
                          fontSize:10,borderBottom:`1px solid ${C.rule}`}}>{r.fmt(r.v1)}</td>
                        <td style={{padding:"8px 10px",textAlign:"right",fontFamily:"monospace",
                          fontSize:10,borderBottom:`1px solid ${C.rule}`}}>{r.fmt(r.v2)}</td>
                        <DeltaCell v1={r.v1} v2={r.v2} invert={r.invert}/>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div style={{marginTop:12,fontSize:9,color:C.muted}}>
                Delta positivo em verde = melhoria. Para inefici&ecirc;ncia e desperd&iacute;cio, redu&ccedil;&atilde;o (delta negativo) &eacute; melhoria.
              </div>
            </div>
          );
        })()}

        {/* ══ TAB 7: SIMULADOR WHAT-IF ═════════════════════════════ */}
        {tab===7 && (
          <div>
            <SecTitle>Simulador What-If</SecTitle>
            <div style={{background:"#fff3e8",border:`1px solid ${C.orange}44`,
              borderRadius:3,padding:"10px 14px",marginBottom:20,fontSize:10,color:C.orange}}>
              Ajuste tarifas e estrutura de leitos para simular cen&aacute;rios alternativos.
              Os dados mensais do per&iacute;odo ativo s&atilde;o mantidos &mdash; apenas os par&acirc;metros mudam.
            </div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
              {/* Coluna: Parametros simulados */}
              <div>
                <div style={{fontWeight:700,fontSize:10,textTransform:"uppercase",
                  letterSpacing:1.5,color:C.muted,marginBottom:10}}>Par&acirc;metros Simulados</div>
                <TwoCol gap={8}>
                  <FieldN label="Enf. Local (R$)" value={simParams.enfLocal}
                    onChange={v=>setSimParams(p=>({...p,enfLocal:v}))} mono/>
                  <FieldN label="Enf. IC (R$)" value={simParams.enfIC}
                    onChange={v=>setSimParams(p=>({...p,enfIC:v}))} mono/>
                  <FieldN label="Apt. Local (R$)" value={simParams.aptLocal}
                    onChange={v=>setSimParams(p=>({...p,aptLocal:v}))} mono/>
                  <FieldN label="Apt. IC (R$)" value={simParams.aptIC}
                    onChange={v=>setSimParams(p=>({...p,aptIC:v}))} mono/>
                  <FieldN label="UTI Local (R$)" value={simParams.utiLocal}
                    onChange={v=>setSimParams(p=>({...p,utiLocal:v}))} mono/>
                  <FieldN label="UTI IC (R$)" value={simParams.utiIC}
                    onChange={v=>setSimParams(p=>({...p,utiIC:v}))} mono/>
                </TwoCol>
                <TwoCol gap={8}>
                  <FieldN label="Leitos Instalados" value={simParams.leitosInstalados}
                    onChange={v=>setSimParams(p=>({...p,leitosInstalados:v}))} mono/>
                  <FieldN label="Leitos HD" value={simParams.leitosHD}
                    onChange={v=>setSimParams(p=>({...p,leitosHD:v}))} mono/>
                  <FieldN label="Leitos UTI" value={simParams.leitosUTI}
                    onChange={v=>setSimParams(p=>({...p,leitosUTI:v}))} mono/>
                  <FieldN label="Mix Apt (%)" value={simParams.mixApt}
                    onChange={v=>setSimParams(p=>({...p,mixApt:v}))} mono/>
                </TwoCol>
                <button onClick={()=>setSimParams({...params})} style={{
                  marginTop:8,padding:"6px 14px",borderRadius:3,border:`1px solid ${C.rule}`,
                  background:"#fff",color:C.text,fontSize:10,fontWeight:700,cursor:"pointer"}}>
                  Copiar par&acirc;metros atuais
                </button>
              </div>

              {/* Coluna: Resultado */}
              <div>
                <div style={{fontWeight:700,fontSize:10,textTransform:"uppercase",
                  letterSpacing:1.5,color:C.muted,marginBottom:10}}>Resultado da Simula&ccedil;&atilde;o</div>
                <div style={{background:C.ink,borderRadius:4,padding:"16px"}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
                    <div style={{background:"rgba(255,255,255,0.07)",borderRadius:3,padding:"10px",textAlign:"center"}}>
                      <div style={{fontSize:8,color:"rgba(150,220,185,0.5)",textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>CGP Simulado</div>
                      <div style={{fontSize:16,fontWeight:700,color:"#fff",fontFamily:"monospace"}}>
                        {simCgpData ? fmtV(simCgpData.cgp) : NA}
                      </div>
                      {cgpData && simCgpData && (
                        <div style={{fontSize:8,color:simCgpData.cgp>cgpData.cgp?C.orange:C.neon,marginTop:3}}>
                          {simCgpData.cgp>cgpData.cgp?"+":""}{fmtN(((simCgpData.cgp-cgpData.cgp)/cgpData.cgp)*100)}% vs atual
                        </div>
                      )}
                    </div>
                    <div style={{background:"rgba(255,255,255,0.07)",borderRadius:3,padding:"10px",textAlign:"center"}}>
                      <div style={{fontSize:8,color:"rgba(150,220,185,0.5)",textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>CGP Atual</div>
                      <div style={{fontSize:16,fontWeight:700,color:"rgba(200,240,220,0.5)",fontFamily:"monospace"}}>
                        {cgpData ? fmtV(cgpData.cgp) : NA}
                      </div>
                    </div>
                  </div>

                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:12}}>
                    {[
                      {label:"C1 Simulado",v:simC1,color:C.orange},
                      {label:"C2 Simulado",v:simC2,color:C.green},
                      {label:"C3 (fixo)",v:C3,color:C.blue},
                    ].map((item,i)=>(
                      <div key={i} style={{background:"rgba(255,255,255,0.05)",borderRadius:3,
                        padding:"8px",textAlign:"center",borderTop:`2px solid ${item.color}`}}>
                        <div style={{fontSize:7,color:"rgba(150,220,185,0.4)",textTransform:"uppercase",
                          letterSpacing:1,marginBottom:3}}>{item.label}</div>
                        <div style={{fontSize:12,fontWeight:700,color:item.v?"#fff":"#555",
                          fontFamily:"monospace"}}>{item.v?fmtV(item.v):NA}</div>
                      </div>
                    ))}
                  </div>

                  <div style={{background:"rgba(0,150,90,0.18)",border:"1px solid rgba(0,150,90,0.3)",
                    borderRadius:3,padding:"12px",textAlign:"center"}}>
                    <div style={{fontSize:8,color:"rgba(150,220,185,0.5)",textTransform:"uppercase",
                      letterSpacing:2,marginBottom:4}}>Total Simulado</div>
                    <div style={{fontSize:24,fontWeight:700,color:simTOTAL>0?"#fff":"#555"}}>
                      {simTOTAL>0?fmtV(simTOTAL):NA}
                    </div>
                    {TOTAL > 0 && simTOTAL > 0 && (
                      <div style={{fontSize:9,color:simTOTAL>TOTAL?C.neon:C.orange,marginTop:4}}>
                        {simTOTAL>TOTAL?"+":""}{fmtV(simTOTAL-TOTAL)} ({simTOTAL>TOTAL?"+":""}{fmtN(((simTOTAL-TOTAL)/TOTAL)*100)}%) vs atual
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

      </div>

      {/* FOOTER COMPLETO */}
      <div style={{background:C.ink,borderTop:`3px solid ${C.blue}`,marginTop:0}}>
        {/* Linha 1: Logo + documento interno + resp tecnico */}
        <div style={{padding:"14px 24px",display:"flex",alignItems:"center",
          justifyContent:"space-between",flexWrap:"wrap",gap:12,
          borderBottom:`1px solid ${C.blue}33`}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <img src={LOGO_AXIA.horizontalNegativo} alt="AxiaCare"
              style={{height:24,width:"auto",display:"block",opacity:0.9}}/>
            <span style={{fontSize:9,color:`${C.mint}bb`,
              textTransform:"uppercase",letterSpacing:1.5,fontWeight:600}}>
              Gest&atilde;o em Sa&uacute;de
            </span>
            <span style={{fontSize:8,color:`${C.mint}66`,letterSpacing:1}}>
              Documento Interno &middot; Uso Restrito
            </span>
          </div>
          <span style={{fontSize:9,color:`${C.mint}88`}}>
            Resp. T&eacute;cnico: Dr. Guilherme Thom&eacute; &middot; CRM-MG 64193 &middot; RQE 41538 &middot; guilherme@axcare.com.br
          </span>
        </div>
        {/* Linha 2: Links + Copyright */}
        <div style={{padding:"12px 24px",display:"flex",alignItems:"center",
          justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
            {[{l:"axcare.com.br",u:"https://www.axcare.com.br"},{l:"grupocsv.com",u:"https://grupocsv.com"},{l:"medvalor.med.br",u:"https://www.medvalor.med.br"},{l:"thera.tech",u:"https://thera.tech"}].map(({l,u})=>(
              <a key={l} href={u} target="_blank" rel="noopener" style={{fontSize:9,color:`${C.teal}cc`,textDecoration:"none",letterSpacing:0.5}}>{l}</a>
            ))}
          </div>
          <span style={{fontSize:9,color:`${C.mint}55`}}>
            &copy; {new Date().getFullYear()} AxiaCare &middot; Uma empresa do Grupo CSV
          </span>
        </div>
      </div>
    </div>
  );
}


    // Render
    const root = ReactDOM.createRoot(document.getElementById('drg-root'));
    root.render(React.createElement(DRGPlugin));
  </script>

  <!-- Autenticacao Hub -->
  <script src="/scripts/hub-auth.js" data-portal="unimed"></script>
</body>
</html>
