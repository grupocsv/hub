                  {[["1","Escolha o período","Selecione início e fim abaixo.",0],["2","Analise","Painel, Comparativo e Simulador.",1],["3","Exporte","Gere o relatório consolidado em PDF.",1]].map(s => (

                      <div className="drg-onboarding__step-num">{s[0]}</div>
                      <div><div className="drg-onboarding__step-title">{s[1]}</div><div className="drg-onboarding__step-desc">{s[2]}</div></div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div className="card">
              <SecTitle>Período de análise</SecTitle>
              <div className="period-row">
                <div className="field">
                  <label className="field__label">Início</label>
                  <select className="field__select" value={startKey} onChange={e => setStartKey(e.target.value)}>
                    {monthOptions.map(k => <option key={k} value={k}>{keyToLabel(k)}</option>)}
                  </select>
                </div>
                <div className="field">
                  <label className="field__label">Fim</label>
                  <select className="field__select" value={effEnd} onChange={e => setEndKey(e.target.value)}>
                    {monthOptions.filter(k => k >= startKey).map(k => <option key={k} value={k}>{keyToLabel(k)}</option>)}
                  </select>
                </div>
                <button className="btn btn--ghost btn--sm period-row__toggle" onClick={() => setShowShortcuts(v => !v)}>{showShortcuts ? "Ocultar atalhos" : "Atalhos de período"}</button>
              </div>
              {showShortcuts && (
                <div className="chip-group__row" style={{ marginTop:10 }}>
                  {shortcuts.map(s => <button key={s.id} className={`chip ${startKey===s.s && effEnd===s.e ? "chip--active" : ""}`} onClick={() => setPeriod(s.s, s.e)}>{s.label}</button>)}
                </div>
              )}
              <div className="coverage">
                <span><strong>Global:</strong> {segCoverage.global} de {nMonths} competências com dados</span>
                <span><strong>Clínico e cirúrgico:</strong> {segCoverage.clinico} de {nMonths}{lastSegKey ? ` (segmentação disponível até ${keyToLabel(lastSegKey)})` : ""}</span>
                <span><strong>Tarifas aplicadas:</strong> {versionsInPeriod.map(v => `versão ${v.version}`).join(", ") || NA}</span>
              </div>
            </div>

            <div className="card">
              <SecTitle>Competências</SecTitle>
              <Note>As alterações são gravadas no servidor e valem para todos os usuários. Cada campo alterado fica registrado na trilha de auditoria com o nome de quem alterou. No segmento cirúrgico, altas e diárias são calculadas automaticamente (global − clínico).</Note>
              <div className="period-row">
                <div className="field">
                  <label className="field__label">Competência</label>
                  <select className="field__select" value={editKey || ""} onChange={e => setEditKey(e.target.value)}>
                    {monthOptions.slice().reverse().map(k => <option key={k} value={k}>{keyToLabel(k)}{hasCore(maps.global[k]) ? "" : " · sem dados"}</option>)}
                  </select>
                </div>
                <SegTabs value={editSeg} onChange={setEditSeg} options={SEGMENTS}/>
              </div>
              <div className="form-grid">
                {IND_INPUTS.map(f => {
                  const ro = editSeg === "cirurgico" && f.derived;
                  const v = fromInput(draft[f.k], f);
                  const bad = !ro && (Number.isNaN(v) || (v !== null && v < 0) || (f.int && v !== null && !Number.isInteger(v)));
                  return <TextField key={f.k} label={f.label} unit={f.unit} value={draft[f.k] || ""} readOnly={ro} invalid={bad}
                    hint={ro ? "Calculado: global − clínico" : (f.k === "eficiencia" ? "Valor oficial da plataforma" : null)}
                    onChange={val => setDraft(d => ({ ...d, [f.k]: val }))}/>;
                })}
                {editSeg === "global" && (() => { const v = parseInput(draft.bonus); return (
                  <TextField label="Bônus DRG (Programa MG Hosp)" unit="R$" value={draft.bonus || ""} invalid={Number.isNaN(v) || (v !== null && v < 0)} onChange={val => setDraft(d => ({ ...d, bonus: val }))}/>
                ); })()}
              </div>
              {derivedPreview && <div className="field__hint" style={{ marginTop:6 }}>Cirúrgico resultante: {fmtI(derivedPreview.altas)} altas · {fmtN(derivedPreview.realizado)} realizadas · {fmtN(derivedPreview.previsto)} previstas</div>}
              <div className="form-actions">
                <span className="form-actions__meta">{editRow ? <>Última atualização: <strong>{editRow.updated_by_name || editRow.updated_by || NA}</strong> em {fmtDateTime(editRow.updated_at)} · origem {editRow.source === "planilha_v4_evs_20261029" ? "planilha oficial v4 (EVS)" : "edição no Hub"}</> : "Competência ainda sem registro neste segmento."}</span>
                <button className="btn btn--ghost btn--sm" onClick={discardDraft} disabled={saving || draftState.n === 0}>Descartar</button>
                <button className="btn btn--primary btn--sm" onClick={saveMonth} disabled={saving || draftState.n === 0 || draftState.invalid.length > 0}>{saving ? "Salvando..." : `Salvar ${draftState.n ? `(${draftState.n})` : ""}`}</button>
              </div>
              {draftState.invalid.length > 0 && <Note kind="warn">Revise os campos: {draftState.invalid.join(", ")}. Use vírgula como separador decimal; altas devem ser número inteiro.</Note>}
              {saveMsg && <Note kind={saveMsg.kind}>{saveMsg.text}</Note>}
            </div>

            <div className="card">
              <SecTitle>Visão geral das competências do período</SecTitle>
              <div className="drg-table-wrap"><div className="drg-table-scroll">
                <table className="drg-table">
                  <thead><tr><th>Competência</th><th>Altas</th><th>Realizada</th><th>Prevista</th><th>Saldo</th><th>(In)Eficiência</th><th>Bônus</th><th>Segmentos</th><th>Atualizado por</th></tr></thead>
                  <tbody>
                    {keys.map(k => { const r = maps.global[k]; const ok = hasCore(r); const e = effOf(r); return (
                      <tr key={k} className={editKey === k ? "row--selected" : ""} onClick={() => setEditKey(k)} style={{ cursor:"pointer" }}>
                        <td data-label="Competência">{keyToLabel(k)}</td>
                        <td data-label="Altas">{ok ? fmtI(r.altas) : NA}</td>
                        <td data-label="Realizada">{ok ? fmtN(Number(r.realizado)) : NA}</td>
                        <td data-label="Prevista">{ok ? fmtN(Number(r.previsto)) : NA}</td>
                        <td data-label="Saldo" style={{ color: ok ? (r.realizado - r.previsto > 0 ? C.red : C.green) : undefined }}>{ok ? signed(r.realizado - r.previsto) : NA}</td>
                        <td data-label="(In)Eficiência" style={{ color: e != null ? statusOf(e).color : undefined }}>{pct(e)}</td>
                        <td data-label="Bônus">{bonusMap[k] != null ? fmtV(bonusMap[k]) : NA}</td>
                        <td data-label="Segmentos">{hasCore(maps.clinico[k]) ? <span className="badge badge--success">Completo</span> : ok ? <span className="badge badge--partial">Só global</span> : <span className="badge badge--warning">Sem dados</span>}</td>
                        <td data-label="Atualizado por" title={r ? (r.updated_by_name || r.updated_by || "") : ""}>{r ? (shortWho(r.updated_by_name || r.updated_by) || NA) + (/inferida/i.test(r.updated_by_name || "") ? " *" : "") : NA}</td>
                      </tr>
                    ); })}
                  </tbody>
                </table>
              </div></div>
              {keys.some(k => maps.global[k] && /inferida/i.test(maps.global[k].updated_by_name || "")) && <div className="field__hint">* Autoria inferida pelo registro de acesso do Hub (edições anteriores à identificação automática do usuário).</div>}
            </div>
          </div>
        )}

        {/* ═══ ABA 1 · PAINEL ═══ */}
        {tab === 1 && (
          <div>
            <SegTabs value={seg} onChange={setSeg} options={SEGMENTS}/>
            {segLimited && <Note kind="warn">O segmento {SEG_LABEL[seg].toLowerCase()} tem dados em {segCoverage[seg]} das {segCoverage.global} competências com dados globais do período{lastSegKey ? ` (base segmentada até ${keyToLabel(lastSegKey)})` : ""}. Os totais deste segmento não são comparáveis aos globais no mesmo intervalo.</Note>}
            <div className="kpi-grid kpi-grid--6">
              <Pill label="Altas válidas" value={fmtI(A.altas)} color={SEG_COLOR[seg]} sub={`${A.n} competências`}/>
              <Pill label="Permanência realizada" value={fmtN(A.real)} color={SEG_COLOR[seg]} sub="diárias"/>
              <Pill label="Permanência prevista" value={fmtN(A.prev)} color={SEG_COLOR[seg]} sub="diárias"/>
              <Pill label="(In)Eficiência consolidada" value={pct(A.efic)} color={statusOf(A.efic).color} sub={statusOf(A.efic).label} tip="Soma das diárias realizadas ÷ soma das previstas no período. Abaixo de 100% indica permanência menor que a prevista."/>
              <Pill label="Saldo de diárias" value={signed(A.saldo)} color={A.saldo > 0 ? C.red : C.green} sub="realizada − prevista"/>
              <Pill label="Média de permanência" value={fmtN(A.mp, 2)} color={SEG_COLOR[seg]} sub="dias por alta"/>
            </div>

            {seg === "global" ? (
              <div className="card">
                <SecTitle>Impacto financeiro para a operadora</SecTitle>
                <div className="kpi-grid">
                  <Pill label="C1 · Desperdício eliminado" value={fmtV(finance.c1)} color={C.orange} sub={`${fmtN(finance.d1)} diárias · ano-base ${BASE_YEAR}`} tip={`Excesso líquido de diárias do ano-base (${BASE_YEAR}) valorizado pela VPD vigente em cada competência.`}/>
                  <Pill label="C2 · Custo evitado" value={fmtV(finance.c2)} color={C.green} sub={`${fmtN(finance.d2)} diárias evitadas`} tip="Diárias evitadas (prevista − realizada) nos anos posteriores ao ano-base com saldo líquido favorável, valorizadas pela VPD vigente em cada competência."/>
                  <Pill label="C3 · Bônus MG Hosp" value={fmtV(finance.c3)} color={C.blue} sub={`${finance.rows.reduce((a,r) => a + r.bonusMonths, 0)} competências com bônus`} tip="Soma dos bônus DRG registrados para as competências do período."/>
                  <Pill label="Impacto total" value={fmtV(finance.total)} color={C.ink} sub="C1 + C2 + C3"/>
                </div>
                {finance.excesso > 0 && <Note kind="warn">Há ano posterior ao ano-base com saldo líquido de {fmtN(finance.excesso)} diárias acima do previsto. Esse excesso não compõe C1 nem C2 e deve ser analisado separadamente.</Note>}
                <div className="drg-table-wrap"><div className="drg-table-scroll">
                  <table className="drg-table drg-table--dense">
                    <thead><tr><th>Ano</th><th>Meses</th><th>Altas</th><th>Realizada</th><th>Prevista</th><th>Saldo</th><th>(In)Eficiência</th><th>VPD aplicada</th><th>Componente</th><th>Valor</th><th>Bônus</th></tr></thead>
                    <tbody>
                      {finance.rows.map(r => (
                        <tr key={r.year}>
                          <td data-label="Ano">{r.year}</td>
                          <td data-label="Meses">{r.keys.length}</td>
                          <td data-label="Altas">{fmtI(r.altas)}</td>
                          <td data-label="Realizada">{fmtN(r.real)}</td>
                          <td data-label="Prevista">{fmtN(r.prev)}</td>
                          <td data-label="Saldo" style={{ color: r.saldo > 0 ? C.red : C.green }}>{signed(r.saldo)}</td>
                          <td data-label="(In)Eficiência">{pct(r.efic)}</td>
                          <td data-label="VPD aplicada">{r.vpdMedia != null ? fmtV(r.vpdMedia) : NA}{r.versions.length > 1 ? ` (v${r.versions.join(", v")})` : ""}</td>
                          <td data-label="Componente">{r.comp === "C1" ? "C1" : r.comp === "C2" ? "C2" : r.comp === "EXC" ? "Excesso pós-base" : NA}</td>
                          <td data-label="Valor">{r.comp === "C1" || r.comp === "C2" ? fmtV(r.valorComp) : NA}</td>
                          <td data-label="Bônus">{r.bonus > 0 ? fmtV(r.bonus) : NA}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div></div>
                <div className="field__hint">Perspectiva da operadora. C1 e C2 são valores de referência calculados pela VPD (valor faturado ponderado por diária), não custo assistencial apurado. A VPD de cada competência segue a versão de tarifas vigente naquela competência.</div>
              </div>
            ) : (
              <Note>O impacto financeiro (C1, C2 e C3) é apurado apenas na visão global, porque a VPD é única para a unidade. Use esta aba para avaliar eficiência e desfechos do segmento {SEG_LABEL[seg].toLowerCase()}.</Note>
            )}

            <TwoCol>
              <div className="card"><SecTitle>(In)Eficiência DRG mensal · {SEG_LABEL[seg]}</SecTitle><div className="chart-wrap"><ChartCanvas id="ch-eff" config={effChart}/></div></div>
              <div className="card"><SecTitle>Saldo mensal de diárias · {SEG_LABEL[seg]}</SecTitle><div className="chart-wrap"><ChartCanvas id="ch-saldo" config={saldoChart}/></div></div>
            </TwoCol>

            <div className="card">
              <SecTitle>Desfechos e qualidade da informação · {SEG_LABEL[seg]}</SecTitle>
              <div className="field__hint" style={{ marginBottom:10 }}>Valores oficiais mensais, sem consolidação: a base não traz numeradores e denominadores para somar casemix, mortalidade, readmissão, recaída e IQIC.</div>
              <div className="drg-table-wrap"><div className="drg-table-scroll">
                <table className="drg-table">
                  <thead><tr><th>Competência</th><th>(In)Eficiência</th><th>Média perm.</th><th>Casemix</th><th>Mort. ajustada</th><th>Mort. observada</th><th>Readmissão</th><th>Recaída</th><th>IQIC</th></tr></thead>
                  <tbody>
                    {keys.filter(k => maps[seg][k]).map(k => { const r = maps[seg][k]; const p = v => v == null ? NA : pct(Number(v)*100); return (
                      <tr key={k}>
                        <td data-label="Competência">{keyToLabel(k)}</td>
                        <td data-label="(In)Eficiência">{pct(effOf(r))}</td>
                        <td data-label="Média perm.">{r.media_permanencia != null ? fmtN(Number(r.media_permanencia), 1) : NA}</td>
                        <td data-label="Casemix">{r.casemix != null ? fmtN(Number(r.casemix), 4) : NA}</td>
                        <td data-label="Mort. ajustada">{p(r.mortalidade_ajustada)}</td>
                        <td data-label="Mort. observada">{p(r.mortalidade_observada)}</td>
                        <td data-label="Readmissão">{p(r.readmissao)}</td>
                        <td data-label="Recaída">{p(r.recaida)}</td>
                        <td data-label="IQIC">{p(r.iqic)}</td>
                      </tr>
                    ); })}
                  </tbody>
                </table>
              </div></div>
              <div className="iqic-box">
                <div className="iqic-box__title">IQIC · Índice de Qualidade da Informação Clínica</div>
                {iqicStats.length === 0 ? <div className="field__hint">Sem IQIC registrado para o segmento {SEG_LABEL[seg].toLowerCase()} no período. A base oficial traz o IQIC apenas na visão global; o campo pode ser preenchido por segmento quando houver o dado.</div> : (
                  <div className="iqic-box__grid">
                    {iqicStats.map(s => <div key={s.year} className="iqic-box__item"><strong>{s.year}</strong><span>média descritiva {pct(s.mean)}</span><span>{s.n} meses · escala {s.scale} · meta {s.meta}%</span></div>)}
                  </div>
                )}
                <div className="field__hint">Quebra metodológica: até 2024, escala de 0 a 100% (meta 70%); a partir de 2025, nova metodologia com escala de 0 a 200% (meta 100%). Os valores não são conversíveis entre si; a média anual é apenas descritiva.</div>
              </div>
            </div>

            <div className="card export-card">
              <SecTitle>Relatório consolidado</SecTitle>
              <div className="period-row">
                <div className="field">
                  <label className="field__label">Responsável técnico do relatório</label>
                  <select className="field__select" value={selectedConsultant} onChange={e => setSelectedConsultant(e.target.value)}>
                    {Object.entries(CONSULTANTS).map(([k, c]) => <option key={k} value={k}>{c.nome}</option>)}
                  </select>
                </div>
                <button className="btn btn--primary" onClick={() => exportPDF()} disabled={pdfLoading || !hasPeriodData}><Icon name="download" size={14}/> {pdfLoading ? "Gerando..." : "Exportar relatório PDF"}</button>
              </div>
              <div className="field__hint">O PDF reflete o período selecionado ({keyToLabel(startKey)} a {keyToLabel(effEnd)}), a visão global e as versões de tarifas vigentes em cada competência.</div>
            </div>
          </div>
        )}

        {/* ═══ ABA 2 · COMPARATIVO ═══ */}
        {tab === 2 && cmp && (
          <div>
            <SegTabs value={cmpSeg} onChange={setCmpSeg} options={SEGMENTS}/>
            <div className="card">
              <SecTitle>Períodos comparados</SecTitle>
              <div className="chip-group__row">
                {[["homologo","Mesmo período do ano anterior"],["anos","Anos completos"],["custom","Personalizado"]].map(([id, l]) => <button key={id} className={`chip ${cmpPreset===id ? "chip--active" : ""}`} onClick={() => setCmpPreset(id)}>{l}</button>)}
              </div>
              {cmpPreset === "custom" && (
                <div className="cmp-custom">
                  {[["A", cmpA, setCmpA], ["B", cmpB, setCmpB]].map(([n, v, set]) => (
                    <div key={n} className="period-row">
                      <span className="cmp-custom__tag">Período {n}</span>
                      <select className="field__select" value={v.s} onChange={e => set({ ...v, s:e.target.value, e: e.target.value > v.e ? e.target.value : v.e })}>{monthOptions.map(k => <option key={k} value={k}>{keyToLabel(k)}</option>)}</select>
                      <select className="field__select" value={v.e} onChange={e => set({ ...v, e:e.target.value })}>{monthOptions.filter(k => k >= v.s).map(k => <option key={k} value={k}>{keyToLabel(k)}</option>)}</select>
                    </div>
                  ))}
                </div>
              )}
              {cmp.a.n !== cmp.b.n && <Note kind="warn">Os períodos têm quantidades diferentes de competências com dados ({cmp.a.n} e {cmp.b.n}). Totais de altas, diárias e valores não são homólogos; compare preferencialmente a (In)Eficiência e a média de permanência.</Note>}
              <div className="drg-table-wrap"><div className="drg-table-scroll">
                <table className="drg-table">
                  <thead><tr><th>Indicador · {SEG_LABEL[cmpSeg]}</th><th>A · {keyToLabel(cmpA.s)} a {keyToLabel(cmpA.e)}</th><th>B · {keyToLabel(cmpB.s)} a {keyToLabel(cmpB.e)}</th><th>Variação (B − A)</th></tr></thead>
                  <tbody>
                    {[
                      ["Competências com dados", cmp.a.n, cmp.b.n, v => fmtI(v), v => signed(v, 0)],
                      ["Altas válidas", cmp.a.altas, cmp.b.altas, fmtI, v => signed(v, 0)],
                      ["Permanência realizada", cmp.a.real, cmp.b.real, v => fmtN(v), v => signed(v)],
                      ["Permanência prevista", cmp.a.prev, cmp.b.prev, v => fmtN(v), v => signed(v)],
                      ["Saldo de diárias", cmp.a.saldo, cmp.b.saldo, v => signed(v), v => signed(v)],
                      ["(In)Eficiência consolidada", cmp.a.efic, cmp.b.efic, v => pct(v), v => signed(v, 2) + " p.p."],
                      ["Média de permanência (dias)", cmp.a.mp, cmp.b.mp, v => fmtN(v, 2), v => signed(v, 2)],
                      ...(cmp.fa ? [
                        ["C1 · Desperdício eliminado", cmp.fa.c1, cmp.fb.c1, fmtV, fmtV],
                        ["C2 · Custo evitado", cmp.fa.c2, cmp.fb.c2, fmtV, fmtV],
                        ["C3 · Bônus MG Hosp", cmp.fa.c3, cmp.fb.c3, fmtV, fmtV],
                        ["Impacto total", cmp.fa.total, cmp.fb.total, fmtV, fmtV],
                      ] : []),
                    ].map(([l, a, b, f, fd]) => (
                      <tr key={l}>
                        <td data-label="Indicador">{l}</td>
                        <td data-label="Período A">{f(a)}</td>
                        <td data-label="Período B">{f(b)}</td>
                        <td data-label="Variação">{a != null && b != null ? fd(b - a) : NA}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div></div>
              {cmp.fa && <div className="field__hint">C1 é atribuído apenas ao ano-base ({BASE_YEAR}); períodos sem o ano-base mostram C1 igual a zero.</div>}
            </div>
          </div>
        )}

        {/* ═══ ABA 3 · SIMULADOR ═══ */}
        {tab === 3 && simDraft && (
          <div>
            <Note>O Simulador testa cenários de tarifas e parâmetros sem alterar a configuração vigente. Para oficializar um cenário, use “Salvar como nova versão”: ela passa a valer a partir da competência atual e fica assinada com o seu nome.</Note>
            <div className="sim-stack">
              <div className="card">
                <SecTitle>Parâmetros do cenário</SecTitle>
                <div className="form-grid">
                  {PARAM_FIELDS.map(f => <TextField key={f.k} label={f.label} unit={f.money ? "R$" : f.int ? "leitos" : "%"} value={simDraft[f.k]} invalid={Number.isNaN(parseInput(simDraft[f.k])) || parseInput(simDraft[f.k]) === null}
                    hint={f.k === "defaultLocalPct" ? "Padrão 80%: não há fonte mensal da proporção Local/Intercâmbio" : null}
                    onChange={val => setSimDraft(d => ({ ...d, [f.k]: val }))}/>)}
                </div>
                <div className="form-actions">
                  <button className="btn btn--ghost btn--sm" onClick={() => setSimDraft(paramsToDraft(currentVersion.params))}><Icon name="refresh" size={13}/> Carregar valores vigentes</button>
                  <button className="btn btn--primary btn--sm" disabled={!sim || sim.errors.length > 0 || !simDiffers} onClick={() => openVersionModal(sim.params, "simulador")}><Icon name="edit" size={13}/> Salvar como nova versão</button>
                </div>
              </div>
              <div className="card">
                <SecTitle>Resultado no período selecionado</SecTitle>
                {sim && sim.errors.length > 0 ? <Note kind="warn">Revise: {sim.errors.join(", ")}.</Note> : sim && (
                  <div>
                    <div className="kpi-grid kpi-grid--2 sim-kpis">
                      <Pill label="VPD simulada" value={fmtV(sim.vpd.vpd)} color={C.blue} sub="R$ por diária"/>
                      <Pill label="VPD vigente" value={fmtV(currentVPD ? currentVPD.vpd : null)} color={C.ink} sub={verLabel(currentVersion)}/>
                    </div>
                    <div className="drg-table-wrap"><div className="drg-table-scroll">
                      <table className="drg-table">
                        <thead><tr><th>Componente</th><th>Cenário</th><th>Configuração real</th><th>Diferença</th></tr></thead>
                        <tbody>
                          {[["C1 · Desperdício eliminado","c1"],["C2 · Custo evitado","c2"],["C3 · Bônus MG Hosp","c3"],["Impacto total","total"]].map(([l, k]) => (
                            <tr key={k}><td data-label="Componente">{l}</td><td data-label="Cenário">{fmtV(sim.fin[k])}</td><td data-label="Real">{fmtV(finance[k])}</td><td data-label="Diferença">{fmtV(sim.fin[k] - finance[k])}</td></tr>
                          ))}
                        </tbody>
                      </table>
                    </div></div>
                    <div className="field__hint">No cenário, a VPD simulada é aplicada a todas as competências do período. Na configuração real, cada competência usa a versão vigente nela.</div>
                  </div>
                )}
              </div>
            </div>
          </div>
        )}

        {/* ═══ ABA 4 · CONFIGURAÇÃO ═══ */}
        {tab === 4 && currentVersion && (
          <div>
            <div className="card config-lock">
              <div className="config-lock__head">
                <div className="config-lock__icon"><Icon name="lock" size={18}/></div>
                <div>
                  <div className="config-lock__title">Configuração vigente · versão {currentVersion.version}</div>
                  <div className="config-lock__meta">Vigente desde {keyToLabel(currentVersion.effective_from)} · assinada por <strong>{currentVersion.created_by_name}</strong> em {fmtDateTime(currentVersion.created_at)}</div>
                </div>
                <button className="btn btn--secondary btn--sm config-lock__btn" onClick={() => openVersionModal(currentVersion.params, "configuracao")}><Icon name="edit" size={13}/> Nova versão</button>
              </div>
              <div className="field__hint">A configuração é travada e compartilhada. Alterações geram uma nova versão assinada, que vale a partir da competência atual ({currentComp ? keyToLabel(currentComp) : NA}); competências anteriores preservam a versão em que foram apuradas.</div>
              <div className="param-grid">
                {PARAM_FIELDS.map(f => <div key={f.k} className="param-grid__item"><span>{f.label}</span><strong>{fmtParam(f, currentVersion.params[f.k])}</strong></div>)}
              </div>
            </div>

            {currentVPD && (
              <div className="card">
                <SecTitle>Cálculo da VPD vigente</SecTitle>
                <div className="kpi-grid">
                  <Pill label="UTI ponderada" value={fmtV(currentVPD.utiP)} color={C.deep}/>
                  <Pill label="Apartamento ponderado" value={fmtV(currentVPD.aptP)} color={C.deep}/>
                  <Pill label="Enfermaria ponderada" value={fmtV(currentVPD.enfP)} color={C.deep}/>
                  <Pill label="VPD" value={fmtV(currentVPD.vpd)} color={C.ink} sub="R$ por diária faturada"/>
                </div>
                <div className="formula">
                  <div>Leitos operacionais = {fmtI(currentVersion.params.leitosInstalados)} instalados − {fmtI(currentVersion.params.leitosHD)} de hospital-dia = {fmtI(currentVPD.op)}</div>
                  <div>Peso UTI = {fmtI(currentVersion.params.leitosUTI)} ÷ {fmtI(currentVPD.op)} = {fmtN(currentVPD.wUTI*100, 2)}% · peso convencional = {fmtN(currentVPD.wConv*100, 2)}%</div>
                  <div>Cada tarifa ponderada = {pct(currentVPD.pl*100, 0)} × Local + {pct(currentVPD.pi*100, 0)} × Intercâmbio</div>
                  <div>Convencional = {pct(currentVPD.wApt*100, 0)} × Apartamento + {pct(currentVPD.wEnf*100, 0)} × Enfermaria = {fmtV(currentVPD.convP)}</div>
                  <div><strong>VPD = {fmtN(currentVPD.wUTI*100, 2)}% × {fmtV(currentVPD.utiP)} + {fmtN(currentVPD.wConv*100, 2)}% × {fmtV(currentVPD.convP)} = {fmtV(currentVPD.vpd)}</strong></div>
                </div>
              </div>
            )}

            <div className="card">
              <SecTitle>Histórico de versões</SecTitle>
              <div className="drg-table-wrap"><div className="drg-table-scroll">
                <table className="drg-table">
                  <thead><tr><th>Versão</th><th>Vigência</th><th>VPD</th><th>Assinada por</th><th>Registrada em</th><th>Motivo</th></tr></thead>
                  <tbody>
                    {versions.slice().reverse().map(v => (
                      <tr key={v.version}>
                        <td data-label="Versão">{v.version}{currentVersion.version === v.version ? " (vigente)" : ""}</td>
                        <td data-label="Vigência">desde {keyToLabel(v.effective_from)}</td>
                        <td data-label="VPD">{fmtV(Number(v.vpd_reference), 2)}</td>
                        <td data-label="Assinada por">{v.created_by_name}</td>
                        <td data-label="Registrada em">{fmtDateTime(v.created_at)}</td>
                        <td data-label="Motivo" className="cell-wrap">{v.note}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div></div>
            </div>

            <div className="card">
              <SecTitle>Trilha de auditoria</SecTitle>
              <div className="drg-table-wrap"><div className="drg-table-scroll">
                <table className="drg-table">
                  <thead><tr><th>Data</th><th>Competência</th><th>Segmento</th><th>Campo</th><th>De</th><th>Para</th><th>Autor</th></tr></thead>
                  <tbody>
                    {audit.slice(0, auditLimit).map(a => (
                      <tr key={a.id}>
                        <td data-label="Data">{fmtDateTime(a.changed_at)}</td>
                        <td data-label="Competência">{a.month_key ? keyToLabel(a.month_key) : NA}</td>
                        <td data-label="Segmento">{a.entity === "tariff_version" ? "Tarifas" : SEG_LABEL[a.segment] || "Global"}</td>
                        <td data-label="Campo">{FIELD_LABEL[a.field_changed] || a.field_changed}</td>
                        <td data-label="De">{fmtAuditVal(a, a.old_value)}</td>
                        <td data-label="Para">{fmtAuditVal(a, a.new_value)}</td>
                        <td data-label="Autor" title={a.attribution_note || ""}>{a.changed_by_name || a.changed_by}{a.attribution_note ? " *" : ""}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div></div>
              {audit.some(a => a.attribution_note) && <div className="field__hint">* Autoria inferida pelo registro de acesso do Hub (edições anteriores à identificação automática do usuário).</div>}
              {audit.length > auditLimit && <button className="btn btn--ghost btn--sm" style={{ marginTop:8 }} onClick={() => setAuditLimit(l => l + 50)}>Mostrar mais</button>}
            </div>
          </div>
        )}
      </div>

      {/* MODAL · NOVA VERSÃO */}
      {verModal && (
        <div className="modal" role="dialog" aria-modal="true" aria-labelledby="ver-title">
          <div className="modal__box">
            <div className="modal__head">
              <div id="ver-title" className="modal__title">Nova versão de tarifas e parâmetros</div>
              <button className="modal__close" aria-label="Fechar" onClick={() => !verModal.busy && setVerModal(null)}>&times;</button>
            </div>
            <div className="modal__body">
              {!verModal.preview ? (
                <React.Fragment>
                  <div className="form-grid form-grid--2">
                    {PARAM_FIELDS.map(f => <TextField key={f.k} label={f.label} unit={f.money ? "R$" : f.int ? "leitos" : "%"} value={verModal.draft[f.k]} invalid={Number.isNaN(parseInput(verModal.draft[f.k])) || parseInput(verModal.draft[f.k]) === null}
                      onChange={val => setVerModal(m => ({ ...m, draft: { ...m.draft, [f.k]: val } }))}/>)}
                  </div>
                  <div className="field">
                    <label className="field__label">Motivo da alteração</label>
                    <textarea className="field__input field__textarea" rows={3} maxLength={600} value={verModal.note} placeholder="Ex.: reajuste contratual das diárias a partir desta competência" onChange={e => setVerModal(m => ({ ...m, note: e.target.value }))}/>
                    <div className="field__hint">Obrigatório, mínimo de 10 caracteres. A versão será assinada como <strong>{user ? user.name : NA}</strong>.</div>
                  </div>
                </React.Fragment>
              ) : (() => {
                const pv = verModal.preview; const diffs = PARAM_FIELDS.filter(f => !sameNum(pv.params[f.k], currentVersion.params[f.k]));
                return (
                  <div>
                    <Note kind="warn">Confira antes de confirmar. A versão {pv.version} passa a valer a partir de <strong>{keyToLabel(pv.effective_from)}</strong> para todos os usuários e não pode ser apagada; uma correção exige nova versão.</Note>
                    <div className="drg-table-wrap"><div className="drg-table-scroll">
                      <table className="drg-table">
                        <thead><tr><th>Parâmetro</th><th>Versão {currentVersion.version}</th><th>Versão {pv.version}</th></tr></thead>
                        <tbody>
                          {diffs.map(f => <tr key={f.k}><td data-label="Parâmetro">{f.label}</td><td data-label="Atual">{fmtParam(f, currentVersion.params[f.k])}</td><td data-label="Nova">{fmtParam(f, pv.params[f.k])}</td></tr>)}
                          <tr><td data-label="Parâmetro"><strong>VPD</strong></td><td data-label="Atual">{fmtV(Number(currentVersion.vpd_reference))}</td><td data-label="Nova"><strong>{fmtV(pv.vpd_reference)}</strong></td></tr>
                        </tbody>
                      </table>
                    </div></div>
                    <div className="field__hint">Motivo: {pv.note}</div>
                    <div className="field__hint">Assinatura: <strong>{pv.created_by_name}</strong> ({pv.created_by_email})</div>
                  </div>
                );
              })()}
              {verModal.error && <Note kind="warn">{verModal.error}</Note>}
            </div>
            <div className="modal__foot">
              {!verModal.preview ? (
                <React.Fragment>
                  <button className="btn btn--ghost btn--sm" onClick={() => setVerModal(null)} disabled={verModal.busy}>Cancelar</button>
                  <button className="btn btn--primary btn--sm" onClick={previewVersion} disabled={verModal.busy}>{verModal.busy ? "Validando..." : "Revisar alteração"}</button>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <button className="btn btn--ghost btn--sm" onClick={() => setVerModal(m => ({ ...m, preview:null }))} disabled={verModal.busy}>Voltar e editar</button>
                  <button className="btn btn--primary btn--sm" onClick={confirmVersion} disabled={verModal.busy}><Icon name="check" size={13}/> {verModal.busy ? "Registrando..." : "Confirmar e assinar"}</button>
                </React.Fragment>
              )}
            </div>
          </div>
        </div>
      )}

      {/* RODAPÉ */}
      <footer className="drg-footer">
        <div className="drg-footer__top">
          <div className="drg-footer__brand">
            <img src={LOGO_AXIA.horizontalNegativo} alt="AxiaCare" className="drg-footer__logo"/>
            <span className="drg-footer__slogan">Gestão em Saúde</span>
          </div>
          <span className="drg-footer__doc">Documento Interno &middot; Uso Restrito</span>
        </div>
        <div className="drg-footer__bottom">
          <div className="drg-footer__links">
            <a href="https://axcare.com.br" target="_blank" rel="noopener noreferrer">axcare.com.br</a>
            <a href="https://grupocsv.com" target="_blank" rel="noopener noreferrer">grupocsv.com</a>
            <a href="https://medvalor.med.br" target="_blank" rel="noopener noreferrer">medvalor.med.br</a>
            <a href="https://thera.tech" target="_blank" rel="noopener noreferrer">thera.tech</a>
          </div>
          <span className="drg-footer__copy">&copy; {new Date().getFullYear()} AxiaCare &middot; Grupo CSV. Resp. Técnico: Dr. Guilherme Thomé &middot; CRM-MG 64193 &middot; RQE 41538</span>
        </div>
      </footer>

      {/* GLOSSÁRIO */}
      <div className={`drg-glossary-overlay ${glossaryOpen ? "drg-glossary-overlay--open" : ""}`} onClick={() => setGlossaryOpen(false)}></div>
      <aside className={`drg-glossary ${glossaryOpen ? "drg-glossary--open" : ""}`} aria-hidden={!glossaryOpen}>
        <div className="drg-glossary__header">
          <span className="drg-glossary__title">Glossário</span>
          <button className="drg-glossary__close" aria-label="Fechar glossário" onClick={() => setGlossaryOpen(false)}>&times;</button>
        </div>
        <div className="drg-glossary__body">
          <div className="drg-glossary__group">Metodologia DRG Brasil®</div>
          {GLOSSARY_DRG.map(g => <div key={g.t} className="drg-glossary__item"><div className="drg-glossary__term">{g.t}</div><div className="drg-glossary__def">{g.d}</div></div>)}
          <div className="drg-glossary__group">Termos do DRG Analytics</div>
          {GLOSSARY_APP.map(g => <div key={g.t} className="drg-glossary__item"><div className="drg-glossary__term">{g.t}</div><div className="drg-glossary__def">{g.d}</div></div>)}
          <div className="drg-glossary__source">Fontes: Central de Ajuda do Grupo IAG Saúde (Plataforma Valor Saúde Brasil) e notas metodológicas do Escritório de Valor em Saúde da Unimed Governador Valadares.</div>
        </div>
      </aside>
    </React.Fragment>
  );
}

// ─── GLOSSÁRIO ──────────────────────────────────────────────────
const GLOSSARY_DRG = [
  { t:"DRG (Diagnosis Related Groups)", d:"Grupos de Diagnósticos Relacionados. Classifica as internações em grupos clinicamente semelhantes a partir do diagnóstico principal, dos diagnósticos secundários, dos procedimentos realizados, da idade e do sexo, entre outras variáveis." },
  { t:"DRG clínico e DRG cirúrgico", d:"A realização de procedimento cirúrgico determina se a internação é classificada em DRG cirúrgico; sem procedimento cirúrgico, o DRG é clínico. Na base, os valores cirúrgicos de altas e diárias são obtidos por global − clínico." },
  { t:"Altas válidas", d:"Internações que passaram pelo processo completo de codificação, estão com status de alta e aptas a compor os indicadores da plataforma. Nesta base, aplicam-se ainda os filtros FEMG." },
  { t:"Filtros FEMG", d:"Critérios da Federação das Unimeds de Minas Gerais aplicados à base: excluem internações com procedência por transferência de hospital de curta permanência, procedência não informada, altas a pedido, transferências para hospital de curta permanência e evasões." },
  { t:"Permanência prevista", d:"Soma dos dias de internação esperados para cada caso, conforme o DRG e o nível de severidade, calculada pela plataforma a partir de dados históricos brasileiros." },
  { t:"Permanência realizada", d:"Soma dos dias em que os pacientes efetivamente permaneceram internados." },
  { t:"(In)Eficiência DRG", d:"Permanência realizada ÷ permanência prevista. Abaixo de 100%, a permanência foi menor que a prevista (favorável); acima de 100%, maior. No período, é calculada pela soma das diárias, não pela média dos percentuais mensais." },
  { t:"Média de permanência", d:"Diárias realizadas ÷ altas válidas, em dias por alta." },
  { t:"Casemix", d:"Média dos pesos relativos dos DRGs do período; a média nacional de referência é 1. Valores acima de 1 indicam perfil mais complexo. Mantido por mês, sem consolidação." },
  { t:"Mortalidade ajustada por risco", d:"Na base do Escritório de Valor em Saúde, razão entre óbitos previstos e observados. Acima de 100% é favorável (menos óbitos que o previsto). Mantida por mês, sem consolidação." },
  { t:"Taxa de mortalidade observada", d:"Número de óbitos ÷ total de altas do período. Deve ser lida junto do casemix e da mortalidade ajustada." },
  { t:"Readmissão não programada", d:"Nova internação do mesmo paciente em até 30 dias após a alta, no mesmo ou em outro hospital, não planejada." },
  { t:"Internações responsáveis por recaída", d:"Internações de origem às quais se atribui o retorno do paciente pela mesma condição em até 30 dias. É indicador distinto da readmissão, com população e janela próprias." },
  { t:"IQIC", d:"Índice de Qualidade da Informação Clínica. Até 2024, escala de 0 a 100% (meta 70%); a partir de 2025, nova metodologia com escala de 0 a 200% (meta 100%), dez escores de 0 a 2. Os valores das duas metodologias não são conversíveis." },
];
const GLOSSARY_APP = [
  { t:"VPD · Valor Ponderado da Diária Faturada", d:"Valor médio ponderado da diária faturada, em R$ por diária. Combina as tarifas institucionais (UTI, apartamento e enfermaria; local e intercâmbio) com os parâmetros estruturais da unidade. Não é custo assistencial apurado nem receita liquidada." },
  { t:"Versão de tarifas", d:"Conjunto fixo de tarifas e parâmetros, assinado por quem o registrou. Vale a partir da competência em que foi criado; competências anteriores mantêm a versão vigente nelas." },
  { t:"C1 · Desperdício eliminado", d:"Excesso líquido de diárias do ano-base (2024) valorizado pela VPD. É a referência de desperdício operacional que a melhoria da eficiência passou a eliminar." },
  { t:"C2 · Custo evitado", d:"Diárias evitadas (prevista − realizada) nos anos posteriores ao ano-base com saldo líquido favorável, valorizadas pela VPD vigente em cada competência." },
  { t:"C3 · Bônus MG Hosp", d:"Bônus DRG registrado em cada competência. É valor registrado, não calculado pela VPD." },
  { t:"Impacto total", d:"C1 + C2 + C3, na perspectiva da operadora." },
  { t:"Simulador", d:"Testa cenários de tarifas e parâmetros sem alterar a configuração vigente. Um cenário só passa a valer se for salvo como nova versão." },
];

ReactDOM.createRoot(document.getElementById("drg-root")).render(<DRGPlugin/>);
  </script>
  <script src="/scripts/hub-auth.js" data-portal="unimed" defer></script>
</body>
</html>
